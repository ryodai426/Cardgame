<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>七英札闘 Seven Arcana Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at center,#2a2340 0%,#120f1d 70%);color:#eee;font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:13px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:1px solid #8a7340;background:linear-gradient(#4a3c22,#2e2513);color:#f3dfa8;border-radius:6px;padding:6px 12px;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.3)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:linear-gradient(#c89b3c,#8a6420);color:#1a1205;font-weight:bold;border-color:#f0d080}
button.danger{background:linear-gradient(#8a2c2c,#561616);color:#ffd8d8;border-color:#c55}
#app{height:100%}
.game{display:grid;grid-template-columns:1fr 260px;height:100%}
.board{display:grid;grid-template-rows:1fr auto 1fr;gap:6px;padding:6px;min-width:0}
.side{background:rgba(0,0,0,.35);border-left:1px solid #3a3150;display:flex;flex-direction:column;min-height:0}
.prevslot{height:330px;flex:none;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px}
.sidebtns{display:flex;gap:6px;padding:6px;flex-wrap:wrap}
.log{flex:1;overflow-y:auto;padding:6px 8px;font-size:11.5px;line-height:1.45;border-top:1px solid #3a3150}
.log div{border-bottom:1px dotted #2c2540;padding:1px 0}
.log .turn{color:#f0d080;font-weight:bold;margin-top:4px}
.log .dmg{color:#ff8a8a}.log .heal{color:#8aff9a}.log .trash{color:#c9a0ff}.log .sys{color:#888}.log .coin{color:#ffd65a}.log .holy{color:#fff2a8}
.panel{display:flex;gap:8px;padding:6px;border-radius:12px;background:rgba(255,255,255,.04);border:2px solid #2c2540;min-height:0;position:relative}
.panel.active{border-color:var(--pc);box-shadow:0 0 18px -4px var(--pc) inset,0 0 14px -6px var(--pc)}
.info{width:250px;flex:none;display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;gap:8px;align-items:center}
.portrait{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--pc) 0%,#000 120%);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--pc);cursor:pointer;flex:none}
.hname{font-weight:bold;font-size:14px}
.hname small{display:block;font-weight:normal;color:#aaa;font-size:11px}
.pl{display:inline-block;padding:0 6px;border-radius:4px;background:var(--pc);color:#000;font-size:11px;font-weight:bold;margin-right:4px}
.cputag{display:inline-block;padding:0 5px;border-radius:4px;background:#ddd;color:#000;font-size:10px;font-weight:bold;margin-left:4px}
.hpbar{height:16px;background:#3a1010;border-radius:8px;overflow:hidden;position:relative;border:1px solid #000;display:flex}
.hpbar>.hp{height:100%;background:linear-gradient(#ff6b6b,#b32020);transition:width .3s}
.hpbar>.sh{height:100%;background:linear-gradient(#fff6c0,#e0c040);transition:width .3s}
.hpbar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:bold;line-height:15px;text-shadow:0 0 3px #000}
.res{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.res b{color:#fff}
.res .clk{cursor:pointer;text-decoration:underline dotted}
.mana{color:#6fc3ff}.coin{color:#ffd65a}.abyss{color:#c9a0ff}.rage{color:#ff7a7a}.holy{color:#fff2a8}
.abils{display:flex;flex-wrap:wrap;gap:4px}
.abil{padding:3px 7px;font-size:11px}
.abil small{display:block;font-size:9.5px;opacity:.8}
.hand{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;align-items:center;padding:4px;min-width:0}
.hand .empty{color:#666}
.field{display:flex;gap:4px;align-items:center;flex:none;padding:0 4px;border-left:1px dashed #5a4a3a;border-right:1px dashed #5a4a3a}
.dino{width:78px;height:122px;border:2px solid #c0703a;border-radius:10px;background:linear-gradient(#3a2a1a,#1a120a);padding:3px;display:flex;flex-direction:column;align-items:center;font-size:10px;position:relative}
.dino.ready{cursor:pointer;box-shadow:0 0 10px #ffd65a}
.dino.ready:hover{transform:translateY(-3px)}
.dino.tired{opacity:.6}
.dino.weapon{border-color:#c9d6e8;background:linear-gradient(#2a3242,#11141c)}
.dino.band{border-color:#7d6bff;background:linear-gradient(#2a2346,#120f1d)}
.dart{font-size:32px;line-height:1.2}
.dname{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.dhp{width:100%;height:13px;background:#3a1010;border-radius:6px;position:relative;overflow:hidden;margin:3px 0}
.dhp>div{height:100%;background:linear-gradient(#ff6b6b,#b32020)}
.dhp span{position:absolute;inset:0;text-align:center;font-size:9.5px;line-height:13px;font-weight:bold;text-shadow:0 0 2px #000}
.dst{font-weight:bold;font-size:13px}
.dtag{position:absolute;top:2px;right:2px;background:#000b;border-radius:4px;padding:0 3px;font-size:9px;color:#ffd65a}
.dz{font-size:9px;color:#aaa}
.center{display:grid;grid-template-columns:230px 1fr 170px;gap:8px;align-items:center;background:rgba(0,0,0,.3);border-radius:12px;padding:8px;border:1px solid #3a3150;min-height:150px}
.tinfo .big{font-size:16px;font-weight:bold;color:var(--pc)}
.tinfo .inst{margin-top:6px;font-size:12px;color:#ddd;line-height:1.5}
.cbtns{display:flex;flex-direction:column;gap:8px}
.cbtns button{padding:9px}
.stage{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px}
.stage .vs{text-align:center;font-size:13px}
.stage .vs .n{font-size:28px;font-weight:bold}
.stage .vs .a{color:#ff8a6a}.stage .vs .d{color:#7ac8ff}
.stage .res{font-size:15px;font-weight:bold;display:block;text-align:center;margin-top:4px}
.stage .defs{display:flex;gap:4px}
.stage .note{color:#999}
.mini .card{--s:.8}
.card{--s:1;font-size:calc(10px*var(--s));width:10em;height:14.4em;flex:none;border-radius:.8em;padding:.45em .45em .35em;position:relative;display:flex;flex-direction:column;background:linear-gradient(160deg,#2b2638,#17141f);border:.2em solid var(--hc);box-shadow:0 .2em .5em rgba(0,0,0,.6);user-select:none;transition:transform .12s, box-shadow .12s}
.card.attack{background:linear-gradient(160deg,#3d2526,#1b1214)}
.card.skill{background:linear-gradient(160deg,#22304a,#121722)}
.card.curse{background:linear-gradient(160deg,#3a1544,#120716);border-style:dashed}
.card.fusedc{background:linear-gradient(160deg,#4a3518,#1c140a);border-style:double;border-width:.35em}
.card .cost{position:absolute;top:-.35em;left:-.35em;width:2.3em;height:2.3em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fd4ff,#1f5f9e);color:#fff;font-weight:bold;font-size:1.15em;display:flex;align-items:center;justify-content:center;border:.12em solid #cdeeff;text-shadow:0 0 .2em #000}
.card .cname{font-weight:bold;font-size:1.08em;text-align:center;padding-left:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .art{font-size:2.7em;text-align:center;line-height:1.25}
.card .ctype{font-size:.78em;text-align:center;color:#bbb;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:.2em;white-space:nowrap;overflow:hidden}
.card .ctext{font-size:.86em;line-height:1.25;flex:1;overflow:hidden;color:#e8e2f2}
.card .ctext b{color:#ffd780;font-weight:bold}
.card .stats{display:flex;justify-content:space-between;font-weight:bold;font-size:1.15em}
.card .atk{color:#ff8a6a}.card .def{color:#7ac8ff}.card .sk{color:#9fb6ff}.card .cst{color:#d08aff;font-size:.8em}
.card .def i{font-style:normal;font-size:.75em;color:#6fc3ff;margin-left:.15em}
.card .seal{position:absolute;inset:0;border-radius:.6em;background:rgba(160,0,0,.45);display:flex;align-items:flex-start;padding-top:2.6em;justify-content:center;font-size:1.8em;font-weight:bold;color:#fff;text-shadow:0 0 .3em #000;pointer-events:none}
.card .seal span{transform:rotate(-12deg);font-size:.55em;display:block}
.card .ubtns{position:absolute;left:0;right:0;bottom:2.2em;display:flex;justify-content:center;gap:.25em;z-index:3}
.card .ubtns button{font-size:.95em;padding:.15em .35em;border-radius:.4em}
.card .ulbl{position:absolute;left:0;right:0;bottom:4.4em;text-align:center;font-size:.85em;font-weight:bold;color:#fff;text-shadow:0 0 .3em #000;z-index:3}
.card.playable{cursor:pointer;box-shadow:0 0 .8em #ffd65a}
.card.playable:hover{transform:translateY(-.5em)}
.card.unaff{opacity:.55}
.card.target{cursor:crosshair;box-shadow:0 0 1em #ff3b3b;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 1.6em #ff3b3b}}
.card.big{--s:2.2}
.card.token{border-style:dotted;background:linear-gradient(160deg,#3a3418,#16130a)}
.price{position:absolute;bottom:-.6em;right:-.4em;background:#000;border:1px solid #ffd65a;color:#ffd65a;border-radius:1em;padding:0 .5em;font-size:1em;font-weight:bold}
#modal{position:fixed;inset:0;display:none;z-index:50}
#modal.show{display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.72)}
.mbox{background:linear-gradient(#251f35,#16121f);border:2px solid var(--pc,#8a7340);border-radius:14px;padding:14px 18px;max-width:min(1000px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 40px -10px var(--pc,#000)}
.mtitle{font-size:18px;font-weight:bold;color:var(--pc,#f0d080)}
.msub{color:#ccc;line-height:1.5}
.mcards{display:flex;flex-wrap:wrap;gap:10px;overflow-y:auto;padding:8px 4px;max-height:60vh}
.pick{position:relative;border-radius:10px;padding:3px;cursor:pointer;border:3px solid transparent}
.pick.sel{border-color:#ffd65a;background:rgba(255,214,90,.15)}
.pick.sel::after{content:"✔";position:absolute;top:-8px;right:-6px;background:#ffd65a;color:#000;border-radius:50%;width:22px;height:22px;text-align:center;font-weight:bold;line-height:22px}
.pick.dis{cursor:not-allowed}
.pick.dis>.card{opacity:.75}
.dislabel{position:absolute;top:38%;left:0;right:0;text-align:center;background:#000c;color:#ff9a9a;font-weight:bold;font-size:12px}
.msum{font-size:15px;font-weight:bold;color:#fff}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.mbtns button{padding:9px 20px;font-size:14px}
.shoprow{display:flex;gap:12px;flex-wrap:wrap;padding:6px 2px 14px}
.shopitem{display:flex;flex-direction:column;gap:6px;align-items:center}
.shopitem button{padding:4px 8px;font-size:12px}
.sect{font-weight:bold;color:#f0d080;margin-top:4px}
.rules{line-height:1.7;overflow-y:auto;max-height:70vh;padding-right:8px;max-width:760px}
.rules h3{color:#f0d080;margin:10px 0 2px;font-size:14px}
.rules p{margin:2px 0}
#preview{position:fixed;top:8px;right:8px;width:244px;height:320px;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:70}
.fx{position:absolute;font-size:34px;font-weight:900;animation:floatup 1.2s ease-out forwards;text-shadow:0 0 6px #000,0 0 2px #000}
.fx.dmg{color:#ff4a4a}.fx.heal{color:#5aff7a}.fx.coin{color:#ffd65a;font-size:22px}.fx.info{color:#c9a0ff;font-size:20px}.fx.holy{color:#fff2a8;font-size:24px}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:45%;transform:translateX(-50%);background:#000d;border:1px solid #c55;padding:10px 20px;border-radius:8px;z-index:80;display:none;font-size:14px}
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.title h1{font-size:54px;margin:0;color:#f0d080;text-shadow:0 0 20px #c89b3c;letter-spacing:.1em}
.title .en{color:#aaa;letter-spacing:.4em}
.title .heroes{font-size:40px;letter-spacing:.2em}
.select{height:100%;overflow-y:auto;padding:14px 20px}
.select h2{margin:0 0 10px;text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hcard{border:2px solid var(--pc);border-radius:12px;padding:10px 12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.3));cursor:pointer;position:relative;transition:transform .12s}
.hcard:hover{transform:translateY(-3px);box-shadow:0 0 18px -4px var(--pc)}
.hcard .top{display:flex;gap:10px;align-items:center}
.hcard .top .portrait{width:60px;height:60px;font-size:36px}
.hcard .hp{color:#ff8a8a;font-weight:bold}
.hcard p{margin:5px 0;font-size:12px;line-height:1.5}
.lbl{color:#f0d080;font-weight:bold}
.hcard .picked{position:absolute;top:8px;right:10px;background:var(--pc);color:#000;font-weight:bold;padding:2px 8px;border-radius:6px}
.cards{font-size:11px;color:#bbb}
.diff{display:flex;gap:16px;justify-content:center;margin-top:30px}
.diff button{padding:18px 30px;font-size:18px;min-width:180px}
.diff button small{display:block;font-size:12px;font-weight:normal;margin-top:4px}
.over{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:40}
.over h1{font-size:46px;color:#f0d080;margin:0}
.over .w{font-size:80px}
.mbar{display:none}
.card{-webkit-touch-callout:none;-webkit-user-select:none}
/* ================= スマホ縦画面 ================= */
@media (max-width: 760px) and (orientation: portrait) {
  html,body{height:100%;touch-action:manipulation}
  body{font-size:12px}
  #app{height:100dvh}
  .game{display:block;height:100%}
  .side{display:none}
  .board{display:flex;flex-direction:column;height:100%;gap:4px;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .mbar{display:flex;gap:4px;align-items:center;flex:none}
  .mbar button{padding:4px 8px;font-size:12px}
  .mbar .hint{flex:1;color:#888;font-size:10.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel{flex-direction:column;gap:4px;padding:5px;border-radius:10px;flex:none}
  .panel.bot{flex:1 1 auto;min-height:0}
  .info{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:3px 8px}
  .info .hrow{flex:none;gap:6px}
  .info .hpbar{flex:1 1 110px;height:14px}
  .hpbar span{line-height:13px;font-size:10.5px}
  .info .res{flex:1 1 100%;gap:2px 9px;font-size:11.5px}
  .info .passive{display:none}
  .portrait{width:34px;height:34px;font-size:20px;border-width:1.5px}
  .hname{font-size:13px}.hname small{display:none}
  .abil{padding:2px 6px;font-size:10.5px}.abil small{font-size:9px}
  .hand{flex:none;padding:3px 2px 5px;gap:5px;align-items:flex-start}
  .panel.top .card{--s:.6}
  .panel.bot .card{--s:.8}
  .panel.bot .hand{flex:1 1 auto;min-height:0;flex-wrap:wrap;justify-content:center;align-content:flex-start;overflow-x:hidden;overflow-y:auto;padding-top:8px}
  /* 恐竜・バンド・白虎刀がいる時は、手札の横に並べる */
  .panel.bot.hasfield{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:4px}
  .panel.bot.hasfield .info{grid-column:1 / -1}
  .panel.bot.hasfield .field{flex-direction:column;align-self:start;padding-top:8px}
  .panel.top.hasfield{flex-direction:row;flex-wrap:wrap}
  .panel.top.hasfield .info{flex:1 1 100%}
  .panel.top.hasfield .hand{flex:1 1 0;min-width:0}
  .panel.top .dino{width:50px;height:78px;font-size:8px}.panel.top .dart{font-size:17px}.panel.top .dname{max-width:46px}.panel.top .dst{font-size:10px}
  .field{border:none;padding:0;gap:4px;align-self:flex-start}
  .dino{width:60px;height:96px;font-size:9px;padding:2px}
  .dart{font-size:22px}.dname{max-width:56px}.dst{font-size:11px}
  .card .ubtns{bottom:2.6em}
  .card .ubtns button{font-size:11px;padding:3px 4px}
  .card .ulbl{bottom:6.2em;font-size:10px}
  .center{grid-template-columns:1fr auto;grid-template-areas:"info btns" "stage stage";gap:4px 8px;padding:6px 8px;min-height:0;flex:none;border-radius:10px}
  .tinfo{grid-area:info;min-width:0}.tinfo .big{font-size:14px}.tinfo .inst{margin-top:2px;font-size:11px;line-height:1.4}
  .cbtns{grid-area:btns;gap:5px}.cbtns button{padding:7px 10px;font-size:12px}
  .stage{grid-area:stage;min-height:0;gap:8px;justify-content:flex-start}
  .stage .note{display:none}
  .stage .mini .card{--s:.5}
  .stage .vs{font-size:11px}.stage .vs .n{font-size:20px}.stage .res{font-size:12px}
  #modal.show{align-items:flex-end}
  .mbox{max-width:100vw;width:100vw;max-height:88dvh;border-radius:14px 14px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:6px}
  .mtitle{font-size:15px}.msub{font-size:12px;line-height:1.45}
  .mcards{gap:6px;max-height:none;flex:1 1 auto;min-height:0;justify-content:center;padding:6px 0}
  .mcards .card{--s:.92}
  .mbtns{justify-content:stretch}.mbtns button{flex:1;padding:11px 8px;font-size:14px}
  .msum{font-size:13px}
  .shoprow{gap:8px;justify-content:center}.shopitem .card{--s:.88}
  .rules{max-height:none;font-size:12px}
  #preview{inset:0;width:auto;height:auto;top:0;right:0;display:none;background:rgba(5,3,10,.6);z-index:85}
  #preview.show{display:flex}
  .title{gap:12px;padding:12px}
  .title h1{font-size:44px}.title .heroes{font-size:30px;letter-spacing:.1em}
  .title > div:last-child{flex-wrap:wrap;justify-content:center}
  .title > div:last-child button{font-size:16px!important;padding:12px 18px!important;flex:1 1 40%}
  .select{padding:10px}.select h2{font-size:18px}
  .hgrid{grid-template-columns:1fr;gap:8px}
  .diff{flex-direction:column;align-items:stretch;padding:0 10px}
  .over{padding:16px;text-align:center}.over h1{font-size:32px}.over .w{font-size:60px}
  .over > div:last-child, .over > div:nth-last-child(2){flex-wrap:wrap;justify-content:center}
  .lobby{padding:12px}.lobby .box{min-width:0;width:100%}.lobby .code{font-size:38px}
  .waitbox{font-size:12px;padding:6px 12px}
  .log div{font-size:12px}
}
/* ================= スマホ横画面 ================= */
@media (max-height: 500px) and (orientation: landscape) {
  html,body{height:100%;touch-action:manipulation}
  body{font-size:11.5px}
  #app{height:100dvh}
  .game{display:block;height:100%}
  .side{display:none}
  .board{display:grid;height:100%;gap:4px;padding:4px max(4px, env(safe-area-inset-right)) 4px max(4px, env(safe-area-inset-left));
    grid-template-columns:minmax(0,1fr) 172px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top bar" "bot center"}
  .panel.top{grid-area:top}.panel.bot{grid-area:bot;min-height:0}
  .mbar{grid-area:bar;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
  .mbar button{padding:5px 4px;font-size:11.5px}
  .mbar .hint{grid-column:1 / -1;color:#888;font-size:10px;text-align:center}
  .panel{gap:6px;padding:4px 6px;border-radius:10px;min-height:0}
  .info{width:148px;gap:2px}
  .info .hrow{gap:5px}
  .portrait{width:30px;height:30px;font-size:18px;border-width:1.5px}
  .hname{font-size:12.5px}.hname small{display:none}
  .info .hpbar{height:13px}.hpbar span{line-height:12px;font-size:10px}
  .info .res{gap:1px 7px;font-size:11px}
  .info .passive{display:none}
  .abil{padding:2px 5px;font-size:10px}.abil small{font-size:8.5px}
  .hand{padding:3px 2px;gap:4px}
  .panel.top .card{--s:.55}
  .panel.bot .card{--s:.74}
  .panel.bot .hand{flex-wrap:wrap;align-content:flex-start;overflow-x:hidden;overflow-y:auto;align-items:flex-start;padding-top:7px}
  .field{gap:3px;padding:0 3px;align-self:center}

<script>
// ================= utilities =================
let ANIM = 1;
// ゲーム進行用の乱数。オンライン対戦では両者で同じシード値の乱数を使い、同じ結果になるようにする
let RNG = Math.random;
const seeded = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
// 待機中にゲームが入れ替わったら（タイトルに戻って新しく始めた等）、古い処理はそこで打ち切る
class Aborted extends Error {}
const sleep = ms => { const g = G; return new Promise(r => setTimeout(r, ms * ANIM)).then(() => { if (G !== g) throw new Aborted(); }); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = a => a[Math.floor(Math.random() * a.length)];
let UID = 1;
const mk = id => ({ uid: UID++, id });
const D = inst => inst.fdef || CARDS[inst.id];
class GameOver extends Error {}
let G = null, M = null, SCREEN = 'title', SEL = [], MODE = 'pvp', FUSED = {};
const cur = () => G.players[G.turn];
const opp = p => G.players[1 - p.idx];
const isCPU = p => !!(G && G.cpus && G.cpus[p.idx]);
const lvOf = p => G.cpus[p.idx];
// オンライン対戦：ME＝自分のプレイヤー番号。相手側のプレイヤーは isRemote
let ONLINE = false, ME = 0;
const isRemote = p => ONLINE && !!p && p.idx !== ME;
const plabel = p => ONLINE ? (p.idx === ME ? 'あなた' : '相手') : isCPU(p) ? 'CPU' : 'P' + (p.idx + 1);
const pname = p => `${plabel(p)}(${p.hero.short})`;
const removeFrom = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; };
const flatCards = arr => arr.flatMap(c => c.parts ? c.parts : [c]);

const UNSEAL = { hp: 2, coin: 2, mana: 2 };
// ガルドの怒りで上がる攻撃力の上限（CPU同士の自動対戦で調整）
const RAGE_CAP = 3;
// 1回の攻撃に出せる防御カードの上限（守りすぎによる膠着を防ぐ）
let MAX_DEF = 2;

const MIASMA_START = 10;
const miasma = () => G.round < MIASMA_START ? 0 : 1 + Math.floor((G.round - MIASMA_START) / 3);

}
async function damageDino(owner, dn, n, src = '') {

  if (dn.hp <= 0) { removeFrom(owner.field, dn); owner.discard.push(dn.card); log(`${dn.name}は倒れた…`, 'dmg'); }

async function pickOwnDino(p, title) {

    options: opts.map(x => ({ label: x ? `${x.art}${x.name}（❤${x.hp}）` : `${o.hero.art}${o.hero.short}（❤${o.hp}）`, value: x })) });
}

// ================= fusion =================
function buildFused(inst) {
  const ds = inst.parts.map(D);
  const bonusAtk = ds.reduce((t, d) => t + ((d.part && d.part.atk) || 0), 0);
  const costRed = ds.reduce((t, d) => t + ((d.part && d.part.cost) || 0), 0);
  const drawN = ds.reduce((t, d) => t + ((d.part && d.part.draw) || 0), 0);
  const isAtk = ds.some(d => d.type === 'attack');
  const seq = key => ds.some(d => d[key]) ? async x => { for (const d of ds) if (d[key]) await d[key](x); } : null;
  const texts = ds.map(d => (d.text || '').replace(/\n?【部品】[^\n]*/g, '').trim()).filter(t => t);
  return { name: ds.map(d => d.name).join('＋'), type: isAtk ? 'attack' : 'skill', hero: 'mech', fused: true,
    cost: Math.max(0, ds.reduce((t, d) => t + d.cost, 0) - costRed - 1 - (inst.opt || 0)),
    atk: isAtk ? ds.filter(d => d.type === 'attack').reduce((t, d) => t + d.atk, 0) + bonusAtk + 2 : 0,
    def: ds.reduce((t, d) => t + d.def, 0), dc: Math.max(...ds.map(d => d.dc || 0)), price: ds.reduce((t, d) => t + d.price, 0), art: '⚙️',
    text: `【合成】${bonusAtk ? `部品ボーナスATK+${bonusAtk}\n` : ''}${drawN ? `部品ボーナス：使用時${drawN}枚引く\n` : ''}${texts.join('\n')}`,
    unblockable: ds.some(d => d.unblockable), play: drawN ? (sp => async x => { if (sp) await sp(x); await draw(x.p, drawN); })(seq('play')) : seq('play'), hit: seq('hit'), defend: seq('defend') };
}
const fusable = p => p.hand.filter(c => D(c).type !== 'curse' && !G.seals.has(c.uid));
function fuse(p, a, b) {
  p.coins -= 1; p.used.fuse = (p.used.fuse || 0) + 1;
  const i = p.hand.indexOf(a); removeFrom(p.hand, a); removeFrom(p.hand, b);
  const f = { uid: UID++, id: 'fused', parts: flatCards([a, b]), opt: 0 }; f.fdef = buildFused(f); FUSED[f.uid] = f;
  p.hand.splice(Math.max(0, Math.min(i, p.hand.length)), 0, f);
  log(`${pname(p)}は合成！「${f.fdef.name}」（コスト${f.fdef.cost}）`); render();
}
function optimize(p, f) { p.coins -= 2; p.used.opt = 1; f.opt++; f.fdef = buildFused(f); log(`最適化！「${f.fdef.name}」のコスト${f.fdef.cost}`); render(); }

function log(t, cls = '') { if (!G) return; G.log.unshift({ t, cls }); if (G.log.length > 300) G.log.pop(); }
function fx(pi, text, kind) {

function toast(t) { if (NET_APPLYING) return; const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = 'none', 1600); }

// ================= core helpers =================
async function damage(t, n, src = '', pierce = false) {
  if (n <= 0) return 0;
  if (!pierce && t.shield > 0) {
    const ab = Math.min(t.shield, n); t.shield -= ab; n -= ab;
    fx(t.idx, `✨-${ab}`, 'holy'); log(`${pname(t)}の聖なる盾が${ab}ダメージを防いだ`, 'holy');
    if (n <= 0) { render(); return 0; }
  }
  t.hp -= n; fx(t.idx, `-${n}`, 'dmg');
  log(`${pname(t)}に${n}ダメージ${src ? '（' + src + '）' : ''}`, 'dmg'); render();
  if (t.hp <= 0) { t.hp = 0; G.winner = 1 - t.idx; throw new GameOver(); }
  return n;
}
const loseHp = (p, n, src) => damage(p, n, src, true);
async function heal(p, n) { const a = Math.min(n, p.maxHp - p.hp); if (a > 0) { p.hp += a; fx(p.idx, `+${a}`, 'heal'); log(`${pname(p)}はHP${a}回復`, 'heal'); render(); } }
function gainCoins(p, n) { if (n <= 0) return; p.coins += n; fx(p.idx, `🪙+${n}`, 'coin'); log(`${pname(p)} コイン+${n}`, 'coin'); }
function gainMana(p, n) { p.mana += n; log(`${pname(p)} マナ+${n}`); }
function gainShield(p, n) { p.shield += n; fx(p.idx, `✨盾+${n}`, 'holy'); log(`${pname(p)} 聖なる盾+${n}（計${p.shield}）`, 'holy'); render(); }
function refill(p) { if (p.deck.length === 0 && p.discard.length > 0) { p.deck = shuffle(flatCards(p.discard)); p.discard = []; log(`${pname(p)} 捨て札をシャッフルして山札へ`, 'sys'); } }
async function draw(p, n) {
  for (let i = 0; i < n; i++) {
    refill(p); if (!p.deck.length) break;
    const c = p.deck.pop(); p.hand.push(c); const d = D(c);
    if (d.type === 'curse') {
      log(`${pname(p)}は呪い「${d.name}」を引いた`, 'trash');
      if (p.heroId === 'garud') { p.rage++; log(`怒り+1（${p.rage}）`, 'dmg'); }
      if (d.draw) await d.draw({ p, o: opp(p), card: c });
    }
  }
  render();
}
function trash(owner, c) {
  G.trash.push(...flatCards([c])); log(`${pname(owner)}の「${D(c).name}」を破棄`, 'trash');
  for (const pl of G.players) if (pl.heroId === 'kuru') { pl.abyss++; fx(pl.idx, '深淵+1', 'info'); }
}
async function trashFromHand(p, max, title = '破棄するカードを選択') {

  const s = await choose({ who: p, title, sub: `${max}枚まで選べます（破棄＝ゲームから除外）`, cards: p.hand, min: 0, max, confirm: '破棄する', emptyConfirm: '破棄しない', ai: 'trash' });
  for (const c of s) { removeFrom(p.hand, c); trash(p, c); }
  render(); return s;
}
async function lookTopTrash(p, n, max, greedy = false) {
  refill(p); const top = p.deck.slice(-n).reverse(); if (!top.length) return [];
  const s = await choose({ who: p, title: `山札の上${top.length}枚`, sub: `破棄するカードを${max >= top.length ? '好きなだけ' : max + '枚まで'}選択（残りは山札の上に戻る）`, cards: top, min: 0, max, confirm: '破棄する', emptyConfirm: '破棄しない', ai: greedy ? 'trashGreedy' : 'trash' });
  for (const c of s) { removeFrom(p.deck, c); trash(p, c); }
  render(); return s;
}
// 相手が自分の手札から選んで破棄する（相手は何も得ない）
async function oppTrashOwn(o, n, src) {

async function mill(t, n) { for (let i = 0; i < n; i++) { refill(t); if (!t.deck.length) break; trash(t, t.deck.pop()); } render(); }

// temp=true は「石化」：相手のターン開始時に自然に解ける威圧
async function sealMore(p, o, n, temp = false) {

  s.forEach(c => { G.seals.add(c.uid); if (temp) G.tempSeals.add(c.uid); log(`「${D(c).name}」を${temp ? '石化' : '威圧'}`); }); render();
}
async function steal(p, o) {

function discardFromHand(p, c) { if (removeFrom(p.hand, c) && !D(c).token) p.discard.push(c); }
function addCard(p, id, where) {

}
const dcost = (p, c) => Math.max(0, (D(c).dc || 0) - (p.heroId === 'golem' ? 1 : 0));
const price = (p, d) => Math.max(1, d.price - (p.heroId === 'chuta' ? 1 : 0) - (p.discount || 0));
function pruneSeals() { const inHand = new Set(G.players.flatMap(p => p.hand.map(c => c.uid))); for (const u of [...G.seals]) if (!inHand.has(u)) { G.seals.delete(u); G.tempSeals.delete(u); } }

function canUnseal(p, kind) { return kind === 'hp' ? p.hp > UNSEAL.hp : kind === 'coin' ? p.coins >= UNSEAL.coin : p.mana >= UNSEAL.mana; }

// ================= modal =================
function choose(o) {
  if (o.who && isCPU(o.who) && !o.view) return aiChoose(o);
  return new Promise(res => { M = { type: 'choose', ...o, cards: [...o.cards], sel: [], res }; renderModal(); });
}
function chooseOption(o) {
  if (o.who && isCPU(o.who)) return aiOption(o);
  return new Promise(res => { M = { type: 'option', ...o, res }; renderModal(); });
}
function pickToggle(uid) {
  if (!M || M.type !== 'choose' || M.max === 0) return;
  const c = M.cards.find(x => x.uid === uid); if (!c || (M.disabled && M.disabled(c))) return;
  const i = M.sel.indexOf(c);
  if (i >= 0) M.sel.splice(i, 1);
  else if (M.max === 1) M.sel = [c];
  else if (M.sel.length < M.max) M.sel.push(c);
  renderModal();
}
function modalOk() { const m = M; M = null; renderModal(); if (m.res) m.res(m.sel || null); }
function modalCancel() { const m = M; M = null; renderModal(); if (m.res) m.res(null); }
function optPick(i) { const m = M; M = null; renderModal(); m.res(m.options[i].value); }
function closeModal() { M = null; renderModal(); render(); }
function renderModal() {
  const el = document.getElementById('modal');
  if (!M) { el.className = ''; el.innerHTML = ''; return; }
  const pc = M.who ? M.who.hero.color : '#c89b3c';
  // オンライン：相手の選択中は、モーダルの代わりに上部へ小さく表示
  if (isRemote(M.who) && !localModal(M)) {
    el.className = 'wait'; el.innerHTML = `<div class="waitbox" style="--pc:${pc}">⏳ 相手が選択中… <span style="color:#aaa">${M.title}</span></div>`; return;
  }
  el.className = 'show';
  const head = M.who ? `<span class="pl" style="--pc:${pc}">${plabel(M.who)} ${M.who.hero.short}</span>` : '';
  if (M.type === 'choose') {
    const min = Math.min(M.min, M.cards.filter(c => !(M.disabled && M.disabled(c))).length);
    M.sel = M.sel.filter(c => !(M.disabled && M.disabled(c)));
    const cards = M.cards.map(c => {
      const dis = M.disabled ? M.disabled(c) : null; const sel = M.sel.includes(c);
      return `<div class="pick ${sel ? 'sel' : ''} ${dis ? 'dis' : ''}" onclick="pickToggle(${c.uid})">${cardHTML(c, { sealed: G && G.seals && G.seals.has(c.uid), extra: M.extra ? M.extra(c) : '' })}${dis && !(G.seals && G.seals.has(c.uid)) ? `<div class="dislabel">${dis}</div>` : ''}</div>`;
    }).join('');
    const ok = M.sel.length >= min && (!M.validate || M.validate(M.sel));
    const label = M.sel.length === 0 && M.emptyConfirm ? M.emptyConfirm : (M.confirm || '決定');
    el.innerHTML = `<div class="mbox" style="--pc:${pc}"><div class="mtitle">${head}${M.title}</div>${M.sub ? `<div class="msub">${M.sub}</div>` : ''}
      <div class="mcards">${cards || '<div class="msub">（カードなし）</div>'}</div>
      ${M.summary ? `<div class="msum">${M.summary(M.sel)}</div>` : ''}
      <div class="mbtns">${M.cancelable ? '<button onclick="modalCancel()">キャンセル</button>' : ''}<button class="primary" ${ok ? '' : 'disabled'} onclick="modalOk()">${label}</button></div></div>`;
  } else if (M.type === 'option') {
    el.innerHTML = `<div class="mbox" style="--pc:${pc}"><div class="mtitle">${head}${M.title}</div>${M.sub ? `<div class="msub">${M.sub}</div>` : ''}
      <div class="mbtns" style="justify-content:center;flex-wrap:wrap">${M.options.map((o, i) => `<button class="${i === 0 ? 'primary' : ''}" onclick="optPick(${i})">${o.label}</button>`).join('')}</div></div>`;
  } else if (M.type === 'shop') {
    el.innerHTML = shopHTML();
  } else if (M.type === 'html') {
    el.innerHTML = `<div class="mbox" style="--pc:${pc}"><div class="mtitle">${head}${M.title}</div>${M.html}<div class="mbtns"><button class="primary" onclick="closeModal()">閉じる</button></div></div>`;
  }
}
function viewPile(pi, which) {

  if (which === 'deck') cards.sort((a, b) => a.id < b.id ? -1 : 1); // 順番は秘密
  const t = which === 'deck' ? '山札（順不同）' : which === 'discard' ? '捨て札' : '破棄されたカード（全体）';
  choose({ who: which === 'trash' ? null : p, view: true, title: `${t} ${cards.length}枚`, cards, min: 0, max: 0, confirm: '閉じる' });

function buy(src, i) {
  const p = cur(); const arr = src === 'm' ? G.market : p.heroRow; const c = arr[i]; if (!c) return false;
  const pr = price(p, D(c)); if (p.coins < pr) return false;
  p.coins -= pr; arr.splice(i, 1); p.discard.push(c);
  log(`${pname(p)}は「${D(c).name}」を購入（🪙${pr}）`, 'coin');
  const deck = src === 'm' ? G.marketDeck : p.heroDeck; if (deck.length) arr.splice(i, 0, deck.pop());
  if (M && M.type === 'shop') renderModal();
  render(); return true;
}
function purify() {
  const p = cur(); if (p.coins < 3 || p.used.purify) return;
  M = null; renderModal();
  run(async () => { const t = await trashFromHand(p, 1, 'お祓い：破棄するカード'); if (t.length) { p.coins -= 3; p.used.purify = 1; } });
}

function newPlayer(idx, heroId) {
  const h = HEROES[heroId];
  return { idx, heroId, hero: h, hp: h.hp, maxHp: h.hp, deck: [], hand: [], discard: [], mana: 5, coins: 0, shield: 0, discount: 0,
    abyss: 0, rage: 0, rageNow: 0, storedAtk: 0, blockedAccum: 0, investNext: 0, nextAtkPending: 0, used: {}, attacksThisTurn: 0, skillsThisTurn: 0, turnAtk: 0, heroDeck: [], heroRow: [],
    field: [], dinoDiscount: 0, dinoAtk: 0, elvesThisTurn: 0, elfBless: false, wolfForm: false, burnCount: 0, inferno: false, weathered: [],
    anchor: false, wAtk: 3, wSwings: 1, wUsed: 0, wTurnAtk: 0, wCoinBonus: 0, wDisc: 0, wPierce: false, wInst: null,
    keisei: false, charmBonus: 0, aud: 0, band: [], bandAtk: 0, ward: 0, relicsUsed: 0, lore: false, cardsThisTurn: 0, echoMul: 1 };
}
function startGame(h0, h1, cpus = [null, null]) {
  UID = 1; FUSED = {}; SCREEN = 'game'; M = null; renderModal();
  G = { phase: 'main', turn: 0, round: 1, players: [], market: [], marketDeck: [], trash: [], seals: new Set(), tempSeals: new Set(), log: [], stage: null, busy: false, picks: [h0, h1], cpus };
  [h0, h1].forEach((h, i) => {
    const p = newPlayer(i, h);
    const ids = ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'pouch', 'pouch', HEROES[h].sig];
    p.deck = shuffle(ids.map(mk));
    p.heroDeck = shuffle(HEROES[h].pool.flatMap(id => [mk(id), mk(id)]));
    p.heroRow = p.heroDeck.splice(-3);
    if (h === 'samurai') { p.wInst = { uid: UID++, id: 'byakko' }; FUSED[p.wInst.uid] = p.wInst; syncWeapon(p); }
    if (h === 'rocker') { p.band = ['drummer', 'bassist'].map(id => ({ uid: UID++, id, used: 0, max: 1 })); p.band.forEach((m, k) => { FUSED[m.uid] = m; syncMember(p, k); }); }
    G.players.push(p);
  });
  G.marketDeck = shuffle(NEUTRAL.flatMap(id => [mk(id), mk(id)]));
  G.market = G.marketDeck.splice(-5);
  // 先攻は相手ターンを経ずに攻撃できるので、最初のターンはマナ4
  G.players[0].mana = 4;
  G.players[1].coins += 2;
  // CPU「つよい」のボーナス
  G.players.forEach((p, i) => { if (cpus[i] === 3) { p.maxHp += 3; p.hp += 3; p.coins += 2; } });
  for (const p of G.players) for (let i = 0; i < 5; i++) p.hand.push(p.deck.pop());
  log(`対戦開始！ ${pname(G.players[0])} vs ${pname(G.players[1])}`, 'turn');
  run(startTurn);
}
async function startTurn() {
  const p = cur(), o = opp(p);
  if (ONLINE) netCheck();
  p.used = {}; p.attacksThisTurn = 0; p.skillsThisTurn = 0; p.turnAtk = 0; p.discount = 0; p.nextAtkPending = 0;
  p.rageNow = Math.min(RAGE_CAP, p.rage); p.rage = 0;
  p.dinoDiscount = 0; p.dinoAtk = 0; p.elvesThisTurn = 0; p.elfBless = false;
  p.anchor = false; p.wSwings = 1; p.wUsed = 0; p.wTurnAtk = 0; p.wCoinBonus = 0; p.wDisc = 0;
  p.relicsUsed = 0; p.lore = false; p.cardsThisTurn = 0; p.echoMul = 1;
  p.keisei = false; p.charmBonus = 0; p.bandAtk = 0; p.band.forEach(m => { m.used = 0; m.max = 1; });
  p.field.forEach(dn => dn.exhausted = false);
  if (p.shield) { log(`${pname(p)}の聖なる盾（${p.shield}）が消えた`, 'holy'); p.shield = 0; }
  // ゴーレムの「石化」は相手のターン開始時に解ける
  for (const u of G.tempSeals) G.seals.delete(u);
  G.tempSeals.clear();
  if (p.heroId === 'golem' && p.blockedAccum >= 2) { const b = Math.min(2, Math.floor(p.blockedAccum / 2)); p.storedAtk += b; log(`反撃の力：次の攻撃ATK+${b}`, 'sys'); }
  o.blockedAccum = 0; G.stage = null;
  log(`— ラウンド${G.round}：${pname(p)}のターン —`, 'turn');
  gainCoins(p, p.heroId === 'chuta' ? 2 : 1);
  if (p.investNext) { gainCoins(p, p.investNext); p.investNext = 0; }
  if (p.rageNow) log(`怒り${p.rageNow}：このターンの攻撃ATK+${p.rageNow}`, 'dmg');
  const mz = miasma();
  if (mz) { log(`瘴気が満ちる…`, 'dmg'); await damage(p, mz, '瘴気', true); }
  if (p.heroId === 'rocker' && rlv(p) >= 4) { log('伝説のライブ：1枚引く', 'sys'); await draw(p, 1); }
  G.phase = 'draft'; render();
  await draftStep(p);
  G.phase = o.hand.some(c => D(c).type !== 'curse' && !G.seals.has(c.uid)) ? 'intimidate' : 'main';
  render();
  if (isCPU(p)) await aiTurn(p);
}
async function draftStep(p) {
  const picks = shuffle([...p.hero.draft]).slice(0, 3).map(mk);
  const s = await choose({ who: p, title: '🎁 カード獲得：1枚選んで手札に加える', sub: '獲得したカードはこのターンすぐ使え、その後はデッキの一員になります（獲得しないことも可能）。', cards: picks, min: 0, max: 1, confirm: '獲得する', emptyConfirm: '獲得しない', ai: 'draft' });
  if (s && s.length) { p.hand.push(s[0]); log(`${pname(p)}は「${D(s[0]).name}」を獲得`); render(); }
}
function sealClick(uid) {
  if (G.phase !== 'intimidate' || G.busy || M) return;
  const o = opp(cur()); const c = o.hand.find(x => x.uid === uid); if (!c || D(c).type === 'curse' || G.seals.has(uid)) return;
  G.seals.add(uid); log(`${pname(cur())}は「${D(c).name}」を威圧した`); G.phase = 'main'; render();
}
function skipSeal() { if (G.phase === 'intimidate' && !G.busy) { G.phase = 'main'; render(); } }
async function endTurn() {
  const p = cur();
  if (p.heroId === 'angel') gainShield(p, 2);
  p.wolfForm = false; p.inferno = false;
  const tokens = p.hand.filter(c => D(c).token);
  if (tokens.length) log(`使わなかった財宝${tokens.length}つは消えた`, 'sys');
  p.discard.push(...p.hand.filter(c => !D(c).token)); p.hand = [];
  for (const pl of G.players) pl.discard = flatCards(pl.discard);
  pruneSeals();
  p.mana = 5;
  await draw(p, 5);
  G.stage = null;
  G.turn = 1 - G.turn; if (G.turn === 0) G.round++;
  await startTurn();
}
function handClick(pi, uid) {
  if (!G || G.busy || M) return;
  if (G.phase === 'intimidate') { if (pi !== G.turn) sealClick(uid); else toast('先に相手の手札を1枚【威圧】してください（スキップ可）'); return; }
  if (G.phase !== 'main' || pi !== G.turn || isCPU(cur())) return;
  const p = cur(); const c = p.hand.find(x => x.uid === uid); if (!c) return;
  const d = D(c);
  if (G.seals.has(uid)) { toast('威圧中！ カード上のボタンで解除できます'); return; }
  if (d.type === 'curse') { toast('呪いカードは使用できない'); return; }
  if (p.mana < ccost(p, c)) { toast('マナが足りない'); return; }
  if (d.type === 'summon' && p.field.length >= MAX_FIELD) { toast(`恐竜は${MAX_FIELD}体までしか並べられない`); return; }
  if (d.needDino && !p.field.length) { toast('場に恐竜がいない'); return; }
  run(() => playCard(p, c));
}
// grave=true：捨て札から使う（海賊の釣り上げ）。使用後は山札の一番下へ
async function playCard(p, c, grave = false) {
  const d = D(c), o = opp(p);
  const cost = grave ? graveCost(p, c) : ccost(p, c);
  if (grave) { p.discard = flatCards(p.discard); removeFrom(p.discard, c); log(`${pname(p)}は「${d.name}」を捨て札から釣り上げた！`, 'sys'); }
  else removeFrom(p.hand, c);
  p.mana -= cost; c.costDown = 0;
  const reps = echoReps(p, d); p.cardsThisTurn++;
  const echoLog = () => { if (d.echo) log(`エコー：効果を${reps}回くり返す（上限${d.echo * p.echoMul}）`, 'info'); };
  if (d.elf) p.elvesThisTurn++;
  if (d.type === 'summon') {
    G.stage = { pi: p.idx, card: c, skill: true, result: '召喚！' };
    summonDino(p, c); render(); await sleep(300);
  } else if (d.type === 'skill') {
    G.stage = { pi: p.idx, card: c, skill: true, result: 'スキル発動' };
    log(`${pname(p)}は「${d.name}」を使用`); echoLog();
    render(); await sleep(250);
    if (d.play) for (let r = 0; r < reps; r++) await d.play({ p, o, card: c, grave });
    if (d.token) { p.relicsUsed++; if (p.lore) gainCoins(p, 1); }
    if (grave) p.deck.unshift(c); else if (d.token) {} else if (d.weather) weatherCard(p, c); else p.discard.push(c);
    p.skillsThisTurn++;
    if (p.heroId === 'merla' && p.skillsThisTurn >= 2) await damage(o, 1, '魔力共鳴');
  } else {
    if (d.charm) await resolveCharm(p, o, c);

    if (A[0].can(p) && echo.length >= 2 && p.cardsThisTurn >= 2) return useAb(0);
    if (plain.length && echo.length) { await playCard(p, plain.sort((x, y) => ccost(p, x) - ccost(p, y))[0]); return true; }
    if (echo.length) { await playCard(p, echo.sort((x, y) => D(x).echo - D(y).echo || ccost(p, x) - ccost(p, y))[0]); return true; }
  }
  // 花魁：魅了を撃つ前に傾城
  if (p.heroId === 'oiran' && A[0].can(p) && (lv >= 2 || Math.random() < 0.5) && playable().filter(c => D(c).charm && ccost(p, c) <= p.mana).length >= (o.hand.length >= 2 ? 1 : 2)) return useAb(0);
  // 侍：白虎刀の強化 → 白虎刀で攻撃
  if (p.heroId === 'samurai') {
    const left = p.wSwings - p.wUsed;
    const useful = c => { const k = D(c).wbuff, after = p.mana - ccost(p, c); if (!k) return false; if (k === 'perm') return true; if (k === 'swing') return after >= wCost(p); return left > 0 && after >= wCost(p); };
    const buffs = playable().filter(useful).sort((x, y) => ccost(p, x) - ccost(p, y));
    if (lv >= 2 && buffs.length) { await playCard(p, buffs[0]); return true; }
    if (A[0].can(p) && (lv >= 2 || Math.random() < 0.7)) return useAb(0);
  }
  // カード使用
  const pl = playable();
  if (pl.length) {
    let c;
    if (lv === 1) c = rand(pl);
    else {
      const zero = pl.filter(c => ccost(p, c) === 0 && D(c).type === 'skill' && playScore(p, c) >= 0);
      c = zero[0] || [...pl].sort((x, y) => playScore(p, y) - playScore(p, x))[0];
      if (playScore(p, c) < 0) c = null;
    }
    if (c) { await playCard(p, c); return true; }
  }
  // 余ったマナで使う能力
  if (p.heroId === 'rocker') for (const k of [1, 0]) if (A[k].can(p)) return useAb(k);
  if (p.heroId === 'kuru' && A[0].can(p)) return useAb(0);
  if (p.heroId === 'angel' && A[0].can(p)) return useAb(0);
  if (p.heroId === 'golem' && A[0].can(p) && o.hand.some(c => !G.seals.has(c.uid) && D(c).type !== 'curse')) return useAb(0);
  if (p.heroId === 'merla' && A[0].can(p)) return useAb(0);
  return false;
}
async function aiBuy(p, lv) {
  for (let n = 0; n < 4; n++) {
    const opts = [...G.market.map((c, i) => ['m', i, c]), ...p.heroRow.map((c, i) => ['h', i, c])].filter(x => price(p, D(x[2])) <= p.coins);
    if (!opts.length) return;
    let pick;
    if (lv === 1) { if (Math.random() < 0.5) return; pick = rand(opts); }
    else {
      const score = x => D(x[2]).price + (x[0] === 'h' ? (lv === 3 ? 1.5 : 0.5) : 0) + (D(x[2]).heal && lv === 3 ? -1 : 0) + (p.heroId === 'pirate' && D(x[2]).undead ? 2 : 0) + (p.heroId === 'rocker' && D(x[2]).aud ? 1.5 : 0);
      opts.sort((a, b) => score(b) - score(a)); pick = opts[0];
      if (lv === 3 && D(pick[2]).price <= 2) return;
    }
    buy(pick[0], pick[1]);
    await sleep(350);
  }
}

const NET_MAIN = ['handClick', 'dinoClick', 'useActive', 'endTurnClick', 'buy', 'purify', 'sealClick', 'skipSeal'];
const NET_MODAL = ['pickToggle', 'modalOk', 'modalCancel', 'optPick'];
const NET_ALL = [...NET_MAIN, ...NET_MODAL, 'unsealBtn'];
// 自分だけが見ている画面（ルール・山札確認・道具屋）
function localModal(m) { return !!m && (m.view || m.type === 'html' || m.type === 'shop'); }
// 自分専用のシグナリング設定（?peerhost=example.com:443 など）。通常は PeerJS の無料サーバーを使う
function peerOpts() {
  const h = new URLSearchParams(location.search).get('peerhost'); if (!h) return { debug: 0 };
  const [host, port] = h.split(':'); return { host, port: +(port || 443), path: '/', secure: (port || '443') === '443', debug: 0 };
}
// その操作を、その人（actor）が今行える状態か
function netReady(n, actor, args) {
  if (!G || G.phase === 'over') return false;
  const gameModal = M && !localModal(M) && M.res && M.who && M.who.idx === actor;
  const idle = !G.busy && (G.phase === 'main' || G.phase === 'intimidate') && G.turn === actor;
  if (NET_MODAL.includes(n)) return !!gameModal && (n === 'optPick' ? M.type === 'option' : M.type === 'choose');
  if (n === 'unsealBtn') return args[0] === actor && (gameModal || (idle && G.phase === 'main' && (!M || localModal(M))));
  return idle;
}
function netInstall() {
  for (const n of NET_ALL) {
    const orig = window[n];
    window[n] = function (...args) {
      if (!ONLINE || NET_DEPTH > 0) return orig.apply(this, args);
      // ルールや山札確認など、自分だけの画面の操作は送らない
      if (NET_MODAL.includes(n) && localModal(M)) return orig.apply(this, args);
      const a = n === 'unsealBtn' ? args.slice(1) : args;
      if (!netReady(n, ME, a)) { if (n === 'unsealBtn' && args[0]) args[0].stopPropagation(); return; }
      // 道具屋を開いている間は、購入とお祓いだけ受け付ける
      if (NET_MAIN.includes(n) && M && !(M.type === 'shop' && (n === 'buy' || n === 'purify'))) return;
      netSend({ t: 'act', n, a });
      NET_DEPTH++;
      try { return orig.apply(this, args); } finally { NET_DEPTH--; }
    };
    window[n].orig = orig;
  }
  setInterval(netPump, 50);
}
// 相手の操作を、こちらの画面が同じ状態になったら順番に適用する
function netPump() {
  if (!NET || !ONLINE) return;
  let guard = 0;
  while (NET.q.length && guard++ < 50) {
    const m = NET.q[0], actor = 1 - ME;
    if (!netReady(m.n, actor, m.a)) break;
    NET.q.shift();
    if (!NET_MODAL.includes(m.n) && m.n !== 'unsealBtn' && M && localModal(M)) { M = null; renderModal(); } // 開いていたルール等は閉じる
    const args = m.n === 'unsealBtn' ? [{ stopPropagation() {} }, ...m.a] : m.a;
    NET_DEPTH++; NET_APPLYING = true;
    try { window[m.n].orig(...args); } catch (e) { console.error(e); } finally { NET_DEPTH--; NET_APPLYING = false; }
  }
}
// ズレ検出：ターン開始時の状態を要約して送り合う
function netHash() {
  const s = JSON.stringify([G.round, G.turn, UID, G.trash.length, G.players.map(p => [p.hp, p.mana, p.coins, p.shield, p.hand.map(c => c.uid), p.deck.map(c => c.uid), flatCards(p.discard).length, p.field.map(d => [d.uid, d.hp]), p.wAtk, p.anchor, p.aud, p.keisei, p.ward, p.cardsThisTurn])]);
  let h = 0; for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0; return h;
}
function netCheck() {
  const k = G.round + '-' + G.turn, h = netHash();
  NET.hashes[k] = h; netSend({ t: 'hash', k, h }); netCompare(k);
}
function netCompare(k) {
  const a = NET.hashes[k], b = NET.oppHashes[k];
  if (a === undefined || b === undefined) return;
  if (a !== b && !NET.desync) { NET.desync = true; console.warn('desync at', k); log('⚠ 相手の画面と状態がずれた可能性があります。再戦をおすすめします', 'dmg'); render(); }
}
function netSend(msg) { if (NET && NET.conn && NET.conn.open) NET.conn.send(msg); }
function netClose() {
  if (!NET) return;
  const n = NET; NET = null; ONLINE = false; RNG = Math.random; ME = 0;
  try { n.conn && n.conn.close(); } catch (e) {}
  try { n.peer && n.peer.destroy(); } catch (e) {}
  document.getElementById('netlost').style.display = 'none';
}
function netLost() {
  if (!NET || NET.closing) return;
  NET.lost = true;
  if (SCREEN === 'online') { NET.status = '接続できませんでした。もう一度お試しください'; NET.err = true; render(); return; }
  document.getElementById('netlost').style.display = 'flex';
}
function newCode() { const ch = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += ch[Math.floor(Math.random() * ch.length)]; return s; }
function netFresh(role) {
  netClose();
  NET = { role, peer: null, conn: null, q: [], hashes: {}, oppHashes: {}, myPick: null, oppPick: null, status: '', err: false, code: '', oppAgain: false };
}
function netHost() {
  if (typeof Peer === 'undefined') { netFresh('none'); NET.status = '通信ライブラリを読み込めませんでした（ネット接続を確認してください）'; NET.err = true; render(); return; }
  netFresh('host'); NET.code = newCode(); NET.status = 'サーバーに接続中…'; render();
  const peer = new Peer(NET_PREFIX + NET.code, peerOpts()); NET.peer = peer;
  peer.on('open', () => { if (NET && NET.peer === peer) { NET.status = '相手の参加を待っています…'; render(); } });
  peer.on('connection', conn => {
    if (!NET || NET.peer !== peer || NET.conn) { conn.close(); return; }
    netSetup(conn);
  });
  peer.on('error', e => {
    if (!NET || NET.peer !== peer) return;
    if (e.type === 'unavailable-id') { netHost(); return; } // 合言葉がかぶったら作り直す
    if (NET.conn) { netLost(); return; }
    NET.status = 'エラー：' + (e.type || e.message); NET.err = true; render();
  });
}
function netJoin(code) {
  code = (code || '').trim().toUpperCase();
  if (!code) return;
  if (typeof Peer === 'undefined') { netFresh('none'); NET.status = '通信ライブラリを読み込めませんでした（ネット接続を確認してください）'; NET.err = true; render(); return; }
  netFresh('guest'); NET.code = code; NET.status = `部屋「${code}」に接続中…`; render();
  const peer = new Peer(peerOpts()); NET.peer = peer;
  peer.on('open', () => { if (NET && NET.peer === peer) netSetup(peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' })); });
  peer.on('error', e => {
    if (!NET || NET.peer !== peer) return;
    if (NET.conn && NET.conn.open) { netLost(); return; }
    NET.status = e.type === 'peer-unavailable' ? `部屋「${code}」が見つかりません。合言葉を確認してください` : 'エラー：' + (e.type || e.message);
    NET.err = true; render();
  });
}
function netSetup(conn) {
  NET.conn = conn;
  conn.on('open', () => {
    if (!NET || NET.conn !== conn) return;
    netSend({ t: 'hello', v: 1 });
    MODE = 'online'; SCREEN = 'select'; M = null; renderModal(); render();
  });
  conn.on('data', netRecv);
  conn.on('close', netLost);
  conn.on('error', netLost);
}
function netRecv(m) {
  if (!NET) return;
  switch (m.t) {
    case 'act': NET.q.push(m); netPump(); break;
    case 'hash': NET.oppHashes[m.k] = m.h; netCompare(m.k); break;
    case 'pick': NET.oppPick = m.h; if (SCREEN === 'select') render(); netMaybeStart(); break;
    case 'again': NET.oppAgain = true; NET.oppPick = null; render(); break;
    case 'start': netStart(m); break;
    case 'bye': NET.closing = true; document.getElementById('netlost').style.display = 'flex'; break;
  }
}
function netPick(k) {
  if (!NET) return;
  NET.myPick = k; netSend({ t: 'pick', h: k }); render(); netMaybeStart();
}
// ホストが両者のヒーローがそろったのを確認して開始の合図を送る
function netMaybeStart() {
  if (!NET || NET.role !== 'host' || !NET.myPick || !NET.oppPick || SCREEN !== 'select') return;
  const hostIdx = Math.random() < 0.5 ? 0 : 1; // 先攻はランダム
  const heroes = []; heroes[hostIdx] = NET.myPick; heroes[1 - hostIdx] = NET.oppPick;
  const m = { t: 'start', seed: Math.floor(Math.random() * 4294967296), heroes, hostIdx };
  netSend(m); netStart(m);
}
function netStart(m) {
  ONLINE = true; ME = NET.role === 'host' ? m.hostIdx : 1 - m.hostIdx;
  RNG = seeded(m.seed);
  Object.assign(NET, { q: [], hashes: {}, oppHashes: {}, desync: false, myPick: null, oppPick: null, oppAgain: false });
  document.getElementById('netlost').style.display = 'none';
  startGame(m.heroes[0], m.heroes[1]);
  log(G.turn === ME ? 'あなたが先攻です' : '相手が先攻です', 'sys'); render();
}
function netAgain() {
  if (!NET) return;
  netSend({ t: 'again' });
  NET.myPick = null; MODE = 'online'; SCREEN = 'select'; G = null; M = null; renderModal(); render();
}
function toLobby() { netClose(); SCREEN = 'online'; MODE = 'online'; M = null; renderModal(); render(); }
function copyInvite() {
  const url = location.origin + location.pathname + '?room=' + NET.code;
  const done = () => toast('招待リンクをコピーしました');
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('このリンクを相手に送ってください', url));
  else prompt('このリンクを相手に送ってください', url);
}
function lobbyHTML() {
  const n = NET;
  let body;
  if (n && n.role === 'host' && !n.err) {
    body = `<div class="box"><div>合言葉</div><div class="code">${n.code}</div>
      <div class="row"><button class="primary" onclick="copyInvite()">🔗 招待リンクをコピー</button></div>
      <div class="st" style="margin-top:10px">${n.status}</div>
      <div style="color:#999;font-size:12px">相手に合言葉か招待リンクを送ってください</div></div>
      <button onclick="toLobby()">キャンセル</button>`;
  } else if (n && n.role === 'guest' && !n.err) {
    body = `<div class="box"><div class="st">${n.status}</div></div><button onclick="toLobby()">キャンセル</button>`;
  } else {
    body = `<div class="row">
      <div class="box"><div style="margin-bottom:10px">友だちを招待する</div><button class="primary" style="font-size:18px;padding:10px 26px" onclick="netHost()">🏠 部屋を作る</button></div>
      <div class="box"><div style="margin-bottom:10px">合言葉で参加する</div>
        <div class="row"><input id="joincode" maxlength="5" placeholder="ABCDE" onkeydown="if(event.key==='Enter')netJoin(this.value)"><button class="primary" onclick="netJoin(document.getElementById('joincode').value)">参加</button></div></div></div>
      ${n && n.err ? `<div class="st err">${n.status}</div>` : ''}`;
  }
  return `<div class="lobby"><h2>🌐 オンライン対戦</h2><div style="color:#aaa">別々の端末から、友だちとネット越しに対戦できます</div>${body}
    <button onclick="toTitle()">← タイトルへ</button></div>`;
}
function onlineSelectHTML() {
  const mine = NET && NET.myPick, theirs = NET && NET.oppPick;
  const st = mine ? (theirs ? 'まもなく開始…' : `あなた：${HEROES[mine].name}　／　相手が選んでいます…`) : (theirs ? '相手は選び終わりました' : '');
  return `<div class="select"><h2><span style="color:#4a9cff">あなた</span>のヒーローを選んでください</h2>
  <div style="text-align:center;color:#ffd65a;margin-bottom:10px;min-height:1.4em">${st}　<span style="color:#888;font-size:12px">（相手が何を選んだかは開始まで秘密）</span></div>
  <div class="hgrid">${HERO_ORDER.map(k => { const h = HEROES[k]; const pk = mine === k ? '<div class="picked">あなた</div>' : '';
    return `<div class="hcard" style="--pc:${h.color}" onclick="pickHero('${k}')">${pk}<div class="top"><div class="portrait">${h.art}</div><div><div class="hname">${h.name}<small>${h.title}</small></div><div class="hp">❤ HP ${h.hp}　<span style="color:#ccc;font-weight:normal">難易度 ${h.diff}</span></div></div></div>${heroDetailHTML(h)}</div>`; }).join('')}</div>
  <div style="text-align:center;margin-top:14px"><button onclick="if(confirm('対戦をやめてタイトルに戻りますか？'))toTitle()">← やめる</button></div></div>`;
}
window.addEventListener('beforeunload', () => { if (NET && NET.conn && NET.conn.open) try { NET.conn.send({ t: 'bye' }); } catch (e) {} });
netInstall();
// 招待リンク（?room=XXXXX）から開いたら自動で参加
{ const room = new URLSearchParams(location.search).get('room'); if (room) { SCREEN = 'online'; MODE = 'online'; setTimeout(() => netJoin(room), 0); } }

// card preview on hover
// 全画面表示（Android などで使える。iPhone の Safari は非対応なのでボタン自体を出さない）
const FS_OK = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen) && matchMedia('(pointer: coarse)').matches;
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => toast('全画面にできませんでした'));
}
document.addEventListener('fullscreenchange', () => { if (SCREEN === 'game' && G) render(); });
// 画面の向きが変わったら描き直す（拡大表示などを閉じる）
addEventListener('orientationchange', () => { document.getElementById('preview').classList.remove('show'); LP_SHOWN = false; });
function setPreview(el) {
  const id = el.dataset.cid;
  const inst = id[0] === 'F' ? FUSED[+id.slice(1)] : { uid: 0, id };
  if (inst) document.getElementById('preview').innerHTML = cardHTML(inst, { cls: 'big' });
  return !!inst;
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-cid]');
  if (el && SCREEN === 'game' && !LP_SHOWN) setPreview(el);
});
// スマホ：カードを長押しで拡大表示（指を離すと閉じる。長押しした時はカードを使わない）
let LP = null, LP_SHOWN = false, LP_XY = null;
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('[data-cid]');
  clearTimeout(LP); if (!el || e.target.closest('button') || e.touches.length > 1) return;
  LP_XY = [e.touches[0].clientX, e.touches[0].clientY];
  LP = setTimeout(() => { if (setPreview(el)) { LP_SHOWN = true; document.getElementById('preview').classList.add('show'); if (navigator.vibrate) navigator.vibrate(12); } }, 380);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!LP_XY || LP_SHOWN) return; const t = e.touches[0];
  if (Math.abs(t.clientX - LP_XY[0]) + Math.abs(t.clientY - LP_XY[1]) > 10) clearTimeout(LP);
}, { passive: true });
const lpEnd = () => { clearTimeout(LP); LP_XY = null; if (!LP_SHOWN) return; document.getElementById('preview').classList.remove('show'); setTimeout(() => { LP_SHOWN = false; }, 450); };
document.addEventListener('touchend', lpEnd); document.addEventListener('touchcancel', lpEnd);
document.addEventListener('click', e => { if (LP_SHOWN) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-cid]')) e.preventDefault(); });
render();
</script>
