<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>七英札闘 Seven Arcana Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at center,#2a2340 0%,#120f1d 70%);color:#eee;font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:13px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:1px solid #8a7340;background:linear-gradient(#4a3c22,#2e2513);color:#f3dfa8;border-radius:6px;padding:6px 12px;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.3)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:linear-gradient(#c89b3c,#8a6420);color:#1a1205;font-weight:bold;border-color:#f0d080}
button.danger{background:linear-gradient(#8a2c2c,#561616);color:#ffd8d8;border-color:#c55}
#app{height:100%}
.game{display:grid;grid-template-columns:1fr 260px;height:100%}
.board{display:grid;grid-template-rows:1fr auto 1fr;gap:6px;padding:6px;min-width:0}
.side{background:rgba(0,0,0,.35);border-left:1px solid #3a3150;display:flex;flex-direction:column;min-height:0}
.prevslot{height:330px;flex:none;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px}
.sidebtns{display:flex;gap:6px;padding:6px;flex-wrap:wrap}
.log{flex:1;overflow-y:auto;padding:6px 8px;font-size:11.5px;line-height:1.45;border-top:1px solid #3a3150}
.log div{border-bottom:1px dotted #2c2540;padding:1px 0}
.log .turn{color:#f0d080;font-weight:bold;margin-top:4px}
.log .dmg{color:#ff8a8a}.log .heal{color:#8aff9a}.log .trash{color:#c9a0ff}.log .sys{color:#888}.log .coin{color:#ffd65a}.log .holy{color:#fff2a8}
.panel{display:flex;gap:8px;padding:6px;border-radius:12px;background:rgba(255,255,255,.04);border:2px solid #2c2540;min-height:0;position:relative}
.panel.active{border-color:var(--pc);box-shadow:0 0 18px -4px var(--pc) inset,0 0 14px -6px var(--pc)}
.info{width:250px;flex:none;display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;gap:8px;align-items:center}
.portrait{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--pc) 0%,#000 120%);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--pc);cursor:pointer;flex:none}
.hname{font-weight:bold;font-size:14px}
.hname small{display:block;font-weight:normal;color:#aaa;font-size:11px}
.pl{display:inline-block;padding:0 6px;border-radius:4px;background:var(--pc);color:#000;font-size:11px;font-weight:bold;margin-right:4px}
.cputag{display:inline-block;padding:0 5px;border-radius:4px;background:#ddd;color:#000;font-size:10px;font-weight:bold;margin-left:4px}
.hpbar{height:16px;background:#3a1010;border-radius:8px;overflow:hidden;position:relative;border:1px solid #000;display:flex}
.hpbar>.hp{height:100%;background:linear-gradient(#ff6b6b,#b32020);transition:width .3s}
.hpbar>.sh{height:100%;background:linear-gradient(#fff6c0,#e0c040);transition:width .3s}
.hpbar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:bold;line-height:15px;text-shadow:0 0 3px #000}
.res{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.res b{color:#fff}
.res .clk{cursor:pointer;text-decoration:underline dotted}
.mana{color:#6fc3ff}.coin{color:#ffd65a}.abyss{color:#c9a0ff}.rage{color:#ff7a7a}.holy{color:#fff2a8}
.abils{display:flex;flex-wrap:wrap;gap:4px}
.abil{padding:3px 7px;font-size:11px}
.abil small{display:block;font-size:9.5px;opacity:.8}
.hand{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;align-items:center;padding:4px;min-width:0}
.hand .empty{color:#666}
.center{display:grid;grid-template-columns:230px 1fr 170px;gap:8px;align-items:center;background:rgba(0,0,0,.3);border-radius:12px;padding:8px;border:1px solid #3a3150;min-height:150px}
.tinfo .big{font-size:16px;font-weight:bold;color:var(--pc)}
.tinfo .inst{margin-top:6px;font-size:12px;color:#ddd;line-height:1.5}
.cbtns{display:flex;flex-direction:column;gap:8px}
.cbtns button{padding:9px}
.stage{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px}
.stage .vs{text-align:center;font-size:13px}
.stage .vs .n{font-size:28px;font-weight:bold}
.stage .vs .a{color:#ff8a6a}.stage .vs .d{color:#7ac8ff}
.stage .res{font-size:15px;font-weight:bold;display:block;text-align:center;margin-top:4px}
.stage .defs{display:flex;gap:4px}
.stage .note{color:#999}
.mini .card{--s:.8}
.card{--s:1;font-size:calc(10px*var(--s));width:10em;height:14.4em;flex:none;border-radius:.8em;padding:.45em .45em .35em;position:relative;display:flex;flex-direction:column;background:linear-gradient(160deg,#2b2638,#17141f);border:.2em solid var(--hc);box-shadow:0 .2em .5em rgba(0,0,0,.6);user-select:none;transition:transform .12s, box-shadow .12s}
.card.attack{background:linear-gradient(160deg,#3d2526,#1b1214)}
.card.skill{background:linear-gradient(160deg,#22304a,#121722)}
.card.curse{background:linear-gradient(160deg,#3a1544,#120716);border-style:dashed}
.card.fusedc{background:linear-gradient(160deg,#4a3518,#1c140a);border-style:double;border-width:.35em}
.card .cost{position:absolute;top:-.35em;left:-.35em;width:2.3em;height:2.3em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fd4ff,#1f5f9e);color:#fff;font-weight:bold;font-size:1.15em;display:flex;align-items:center;justify-content:center;border:.12em solid #cdeeff;text-shadow:0 0 .2em #000}
.card .cname{font-weight:bold;font-size:1.08em;text-align:center;padding-left:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .art{font-size:2.7em;text-align:center;line-height:1.25}
.card .ctype{font-size:.78em;text-align:center;color:#bbb;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:.2em;white-space:nowrap;overflow:hidden}
.card .ctext{font-size:.86em;line-height:1.25;flex:1;overflow:hidden;color:#e8e2f2}
.card .ctext b{color:#ffd780;font-weight:bold}
.card .stats{display:flex;justify-content:space-between;font-weight:bold;font-size:1.15em}
.card .atk{color:#ff8a6a}.card .def{color:#7ac8ff}.card .sk{color:#9fb6ff}.card .cst{color:#d08aff;font-size:.8em}
.card .def i{font-style:normal;font-size:.75em;color:#6fc3ff;margin-left:.15em}
.card .seal{position:absolute;inset:0;border-radius:.6em;background:rgba(160,0,0,.45);display:flex;align-items:flex-start;padding-top:2.6em;justify-content:center;font-size:1.8em;font-weight:bold;color:#fff;text-shadow:0 0 .3em #000;pointer-events:none}
.card .seal span{transform:rotate(-12deg);font-size:.55em;display:block}
.card .ubtns{position:absolute;left:0;right:0;bottom:2.2em;display:flex;justify-content:center;gap:.25em;z-index:3}
.card .ubtns button{font-size:.95em;padding:.15em .35em;border-radius:.4em}
.card .ulbl{position:absolute;left:0;right:0;bottom:4.4em;text-align:center;font-size:.85em;font-weight:bold;color:#fff;text-shadow:0 0 .3em #000;z-index:3}
.card.playable{cursor:pointer;box-shadow:0 0 .8em #ffd65a}
.card.playable:hover{transform:translateY(-.5em)}
.card.unaff{opacity:.55}
.card.target{cursor:crosshair;box-shadow:0 0 1em #ff3b3b;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 1.6em #ff3b3b}}
.card.big{--s:2.2}
.price{position:absolute;bottom:-.6em;right:-.4em;background:#000;border:1px solid #ffd65a;color:#ffd65a;border-radius:1em;padding:0 .5em;font-size:1em;font-weight:bold}
#modal{position:fixed;inset:0;display:none;z-index:50}
#modal.show{display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.72)}
.mbox{background:linear-gradient(#251f35,#16121f);border:2px solid var(--pc,#8a7340);border-radius:14px;padding:14px 18px;max-width:min(1000px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 40px -10px var(--pc,#000)}
.mtitle{font-size:18px;font-weight:bold;color:var(--pc,#f0d080)}
.msub{color:#ccc;line-height:1.5}
.mcards{display:flex;flex-wrap:wrap;gap:10px;overflow-y:auto;padding:8px 4px;max-height:60vh}
.pick{position:relative;border-radius:10px;padding:3px;cursor:pointer;border:3px solid transparent}
.pick.sel{border-color:#ffd65a;background:rgba(255,214,90,.15)}
.pick.sel::after{content:"✔";position:absolute;top:-8px;right:-6px;background:#ffd65a;color:#000;border-radius:50%;width:22px;height:22px;text-align:center;font-weight:bold;line-height:22px}
.pick.dis{cursor:not-allowed}
.pick.dis>.card{opacity:.75}
.dislabel{position:absolute;top:38%;left:0;right:0;text-align:center;background:#000c;color:#ff9a9a;font-weight:bold;font-size:12px}
.msum{font-size:15px;font-weight:bold;color:#fff}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.mbtns button{padding:9px 20px;font-size:14px}
.shoprow{display:flex;gap:12px;flex-wrap:wrap;padding:6px 2px 14px}
.shopitem{display:flex;flex-direction:column;gap:6px;align-items:center}
.shopitem button{padding:4px 8px;font-size:12px}
.sect{font-weight:bold;color:#f0d080;margin-top:4px}
.rules{line-height:1.7;overflow-y:auto;max-height:70vh;padding-right:8px;max-width:760px}
.rules h3{color:#f0d080;margin:10px 0 2px;font-size:14px}
.rules p{margin:2px 0}
#preview{position:fixed;top:8px;right:8px;width:244px;height:320px;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:70}
.fx{position:absolute;font-size:34px;font-weight:900;animation:floatup 1.2s ease-out forwards;text-shadow:0 0 6px #000,0 0 2px #000}
.fx.dmg{color:#ff4a4a}.fx.heal{color:#5aff7a}.fx.coin{color:#ffd65a;font-size:22px}.fx.info{color:#c9a0ff;font-size:20px}.fx.holy{color:#fff2a8;font-size:24px}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:45%;transform:translateX(-50%);background:#000d;border:1px solid #c55;padding:10px 20px;border-radius:8px;z-index:80;display:none;font-size:14px}
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.title h1{font-size:54px;margin:0;color:#f0d080;text-shadow:0 0 20px #c89b3c;letter-spacing:.1em}
.title .en{color:#aaa;letter-spacing:.4em}
.title .heroes{font-size:40px;letter-spacing:.2em}
.select{height:100%;overflow-y:auto;padding:14px 20px}
.select h2{margin:0 0 10px;text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hcard{border:2px solid var(--pc);border-radius:12px;padding:10px 12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.3));cursor:pointer;position:relative;transition:transform .12s}
.hcard:hover{transform:translateY(-3px);box-shadow:0 0 18px -4px var(--pc)}
.hcard .top{display:flex;gap:10px;align-items:center}
.hcard .top .portrait{width:60px;height:60px;font-size:36px}
.hcard .hp{color:#ff8a8a;font-weight:bold}
.hcard p{margin:5px 0;font-size:12px;line-height:1.5}
.lbl{color:#f0d080;font-weight:bold}
.hcard .picked{position:absolute;top:8px;right:10px;background:var(--pc);color:#000;font-weight:bold;padding:2px 8px;border-radius:6px}
.cards{font-size:11px;color:#bbb}
.diff{display:flex;gap:16px;justify-content:center;margin-top:30px}
.diff button{padding:18px 30px;font-size:18px;min-width:180px}
.diff button small{display:block;font-size:12px;font-weight:normal;margin-top:4px}
.over{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:40}
.over h1{font-size:46px;color:#f0d080;margin:0}
.over .w{font-size:80px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="preview"></div>
<div id="fxl"></div>
<div id="toast"></div>
<script>
// ================= utilities =================
let ANIM = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms * ANIM));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = a => a[Math.floor(Math.random() * a.length)];
let UID = 1;
const mk = id => ({ uid: UID++, id });
const D = inst => inst.fdef || CARDS[inst.id];
class GameOver extends Error {}
let G = null, M = null, SCREEN = 'title', SEL = [], MODE = 'pvp', FUSED = {};
const cur = () => G.players[G.turn];
const opp = p => G.players[1 - p.idx];
const isCPU = p => !!(G && G.cpus && G.cpus[p.idx]);
const lvOf = p => G.cpus[p.idx];
const pname = p => `${isCPU(p) ? 'CPU' : 'P' + (p.idx + 1)}(${p.hero.short})`;
const removeFrom = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; };
const flatCards = arr => arr.flatMap(c => c.parts ? c.parts : [c]);
// 威圧の解除コスト（CPU同士の自動対戦で調整）
const UNSEAL = { hp: 2, coin: 2, mana: 2 };
// 1回の攻撃に出せる防御カードの上限（守りすぎによる膠着を防ぐ）
let MAX_DEF = 2;
// 瘴気：長期戦を終わらせる時計。ラウンド10から毎ターン開始時にダメージ（3ラウンドごとに+1）
const MIASMA_START = 10;
const miasma = () => G.round < MIASMA_START ? 0 : 1 + Math.floor((G.round - MIASMA_START) / 3);

// ================= card database =================
// x for attack: {p:attacker, o:defender, card, atk, dmg}
// x for skill:  {p, o, card}
// defend/stance: {p:defender, o:attacker, card, a:attackCtx}
// part: 【部品】合成された時のボーナス {atk, cost}
const CARDS = {
  // ---- 基本 ----
  strike: { name: '打撃', type: 'attack', cost: 2, atk: 3, def: 2, dc: 0, price: 1, art: '👊', text: '' },
  guard: { name: '受け流し', type: 'attack', cost: 1, atk: 1, def: 3, dc: 1, price: 1, art: '🤺', text: '防御向きの基本カード' },
  pouch: { name: '小銭袋', type: 'skill', cost: 0, def: 1, dc: 0, price: 1, art: '👛', text: '【使用時】コイン+2', play: async x => gainCoins(x.p, 2) },

  // ---- 共通（道具屋） ----
  sharp: { name: '鋭い一撃', type: 'attack', cost: 3, atk: 5, def: 2, dc: 0, price: 3, art: '🗡️', text: '' },
  heavy: { name: '重撃', type: 'attack', cost: 4, atk: 7, def: 1, dc: 0, price: 5, art: '🔨', text: '' },
  thief: { name: '盗賊の刃', type: 'attack', cost: 2, atk: 3, def: 1, dc: 0, price: 4, art: '🔪', text: '【ヒット時】コイン+2', hit: async x => gainCoins(x.p, 2) },
  ironshield: { name: '鉄の大盾', type: 'attack', cost: 1, atk: 1, def: 5, dc: 1, price: 4, art: '🛡️', text: '堅牢な盾' },
  thorn: { name: '棘の盾', type: 'skill', cost: 0, def: 3, dc: 1, price: 5, art: '🌵', text: '【使用時】コイン+1\n【防御時】攻撃者に2ダメージ',
    play: async x => gainCoins(x.p, 1), defend: async x => damage(x.o, 2, '棘の盾') },
  incinerate: { name: '焼却', type: 'skill', cost: 1, def: 1, dc: 0, price: 3, art: '🔥', text: '【使用時】手札を1枚まで破棄（したらコイン+1）。1枚引く',
    play: async x => { const t = await trashFromHand(x.p, 1); if (t.length) gainCoins(x.p, 1); await draw(x.p, 1); } },
  crystal: { name: '水晶占い', type: 'skill', cost: 1, def: 1, dc: 0, price: 4, art: '🔮', text: '【使用時】山札の上3枚を見て1枚まで破棄。1枚引く',
    play: async x => { await lookTopTrash(x.p, 3, 1); await draw(x.p, 1); } },
  breath: { name: '呼吸法', type: 'skill', cost: 0, def: 1, dc: 0, price: 5, art: '🌬️', text: '【使用時】マナ+1。1枚引く',
    play: async x => { gainMana(x.p, 1); await draw(x.p, 1); } },
  counter: { name: '反撃の構え', type: 'attack', cost: 2, atk: 2, def: 2, dc: 0, price: 5, art: '⚡', text: '【構え】相手の攻撃がヒットした時、これを捨て攻撃者に3ダメージ',
    stance: { on: 'hit', fn: async x => { discardFromHand(x.p, x.card); log(`${pname(x.p)}の【構え】反撃の構え！`); await damage(x.o, 3, '反撃の構え'); } } },
  mikiri: { name: '見切り', type: 'attack', cost: 1, atk: 2, def: 2, dc: 0, price: 4, art: '👁️', text: '【構え】相手のターン最初の攻撃時、これを捨てその攻撃のATK-3',
    stance: { on: 'declare', fn: async x => { if (x.a.p.attacksThisTurn !== 1) return; discardFromHand(x.p, x.card); x.a.atk -= 3; log(`${pname(x.p)}の【構え】見切り！ ATK-3`); fx(x.p.idx, '見切り!', 'info'); } } },
  goldbag: { name: '金貨袋', type: 'skill', cost: 0, def: 1, dc: 0, price: 4, art: '💰', text: '【使用時】コイン+3', play: async x => gainCoins(x.p, 3) },
  hammer: { name: '戦槌', type: 'attack', cost: 3, atk: 4, def: 2, dc: 0, price: 6, art: '⚒️', text: '【ヒット時】相手の手札を1枚選んで捨てさせる', hit: async x => forceDiscard(x.p, x.o, 1) },
  roar: { name: '威圧の咆哮', type: 'skill', cost: 1, def: 1, dc: 0, price: 3, art: '🦁', text: '【使用時】相手の手札を1枚まで追加で【威圧】。1枚引く', play: async x => { await sealMore(x.p, x.o, 1); await draw(x.p, 1); } },
  potion: { name: '回復薬', type: 'skill', cost: 1, def: 1, dc: 0, price: 3, art: '🧪', text: '【使用時】HP3回復', heal: true, play: async x => heal(x.p, 3) },
  axe: { name: '処刑の斧', type: 'attack', cost: 4, atk: 6, def: 1, dc: 0, price: 7, art: '🪓', text: '【ヒット時】相手のHPが8以下なら追加で3ダメージ',
    hit: async x => { if (x.o.hp <= 8) await damage(x.o, 3, '処刑'); } },
  reveal: { name: '看破', type: 'skill', cost: 0, def: 1, dc: 0, price: 3, art: '🔍', text: '【使用時】相手の手札の【構え】カードを全て捨てさせる。1枚引く',
    play: async x => { const st = x.o.hand.filter(c => D(c).stance); st.forEach(c => discardFromHand(x.o, c)); log(`看破：${st.length}枚の構えを捨てさせた`); await draw(x.p, 1); } },

  // ---- 呪い ----
  bloodcurse: { name: '血の呪い', type: 'curse', def: 0, dc: 0, price: 0, art: '🩸', text: '使用・防御不可\n【引いた時】自分に1ダメージ',
    draw: async x => damage(x.p, 1, '血の呪い') },
  madness: { name: '狂気', type: 'curse', def: 0, dc: 0, price: 0, art: '🌀', text: '使用・防御不可\n【引いた時】マナ-1',
    draw: async x => { x.p.mana = Math.max(0, x.p.mana - 1); log(`${pname(x.p)}は狂気に蝕まれマナ-1`); } },

  // ---- 剣士アレン ----
  gale: { hero: 'allen', name: '疾風斬', type: 'attack', cost: 2, atk: 3, def: 2, dc: 0, price: 2, art: '🌪️', text: '【使用時】このターン既に攻撃していればATK+2',
    play: async x => { if (x.p.attacksThisTurn >= 1) x.atk += 2; } },
  step: { hero: 'allen', name: '踏み込み', type: 'attack', cost: 1, atk: 2, def: 1, dc: 0, price: 2, art: '👣', text: '【使用時】次の攻撃のATK+1',

// ================= fusion =================
function buildFused(inst) {
  const ds = inst.parts.map(D);
  const bonusAtk = ds.reduce((t, d) => t + ((d.part && d.part.atk) || 0), 0);
  const costRed = ds.reduce((t, d) => t + ((d.part && d.part.cost) || 0), 0);
  const isAtk = ds.some(d => d.type === 'attack');
  const seq = key => ds.some(d => d[key]) ? async x => { for (const d of ds) if (d[key]) await d[key](x); } : null;
  const texts = ds.map(d => (d.text || '').replace(/\n?【部品】[^\n]*/g, '').trim()).filter(t => t);
  return { name: ds.map(d => d.name).join('＋'), type: isAtk ? 'attack' : 'skill', hero: 'mech', fused: true,
    cost: Math.max(0, ds.reduce((t, d) => t + d.cost, 0) - costRed - 1 - (inst.opt || 0)),
    atk: isAtk ? ds.filter(d => d.type === 'attack').reduce((t, d) => t + d.atk, 0) + bonusAtk : 0,
    def: ds.reduce((t, d) => t + d.def, 0), dc: Math.max(...ds.map(d => d.dc || 0)), price: ds.reduce((t, d) => t + d.price, 0), art: '⚙️',
    text: `【合成】${bonusAtk ? `部品ボーナスATK+${bonusAtk}\n` : ''}${texts.join('\n')}`,
    unblockable: ds.some(d => d.unblockable), play: seq('play'), hit: seq('hit'), defend: seq('defend') };
}
const fusable = p => p.hand.filter(c => D(c).type !== 'curse' && !G.seals.has(c.uid));
function fuse(p, a, b) {
  p.coins -= 1; p.used.fuse = (p.used.fuse || 0) + 1;
  const i = p.hand.indexOf(a); removeFrom(p.hand, a); removeFrom(p.hand, b);
  const f = { uid: UID++, id: 'fused', parts: flatCards([a, b]), opt: 0 }; f.fdef = buildFused(f); FUSED[f.uid] = f;
  p.hand.splice(Math.max(0, Math.min(i, p.hand.length)), 0, f);
  log(`${pname(p)}は合成！「${f.fdef.name}」（コスト${f.fdef.cost}）`); render();
}
function optimize(p, f) { p.coins -= 2; p.used.opt = 1; f.opt++; f.fdef = buildFused(f); log(`最適化！「${f.fdef.name}」のコスト${f.fdef.cost}`); render(); }

// ================= logging / fx =================
function log(t, cls = '') { if (!G) return; G.log.unshift({ t, cls }); if (G.log.length > 300) G.log.pop(); }
function fx(pi, text, kind) {
  if (ANIM === 0) return;
  const el = document.getElementById('panel-' + pi); if (!el) return;
  const r = el.getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'fx ' + kind; d.textContent = text;
  d.style.left = (r.left + 60 + Math.random() * 120) + 'px'; d.style.top = (r.top + r.height * 0.35) + 'px';
  document.getElementById('fxl').appendChild(d); setTimeout(() => d.remove(), 1300);
}
let toastT;
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = 'none', 1600); }

// ================= core helpers =================
async function damage(t, n, src = '', pierce = false) {
  if (n <= 0) return 0;
  if (!pierce && t.shield > 0) {
    const ab = Math.min(t.shield, n); t.shield -= ab; n -= ab;
    fx(t.idx, `✨-${ab}`, 'holy'); log(`${pname(t)}の聖なる盾が${ab}ダメージを防いだ`, 'holy');
    if (n <= 0) { render(); return 0; }
  }
  t.hp -= n; fx(t.idx, `-${n}`, 'dmg');
  log(`${pname(t)}に${n}ダメージ${src ? '（' + src + '）' : ''}`, 'dmg'); render();
  if (t.hp <= 0) { t.hp = 0; G.winner = 1 - t.idx; throw new GameOver(); }
  return n;
}
const loseHp = (p, n, src) => damage(p, n, src, true);
async function heal(p, n) { const a = Math.min(n, p.maxHp - p.hp); if (a > 0) { p.hp += a; fx(p.idx, `+${a}`, 'heal'); log(`${pname(p)}はHP${a}回復`, 'heal'); render(); } }
function gainCoins(p, n) { if (n <= 0) return; p.coins += n; fx(p.idx, `🪙+${n}`, 'coin'); log(`${pname(p)} コイン+${n}`, 'coin'); }
function gainMana(p, n) { p.mana += n; log(`${pname(p)} マナ+${n}`); }
function gainShield(p, n) { p.shield += n; fx(p.idx, `✨盾+${n}`, 'holy'); log(`${pname(p)} 聖なる盾+${n}（計${p.shield}）`, 'holy'); render(); }
function refill(p) { if (p.deck.length === 0 && p.discard.length > 0) { p.deck = shuffle(flatCards(p.discard)); p.discard = []; log(`${pname(p)} 捨て札をシャッフルして山札へ`, 'sys'); } }
async function draw(p, n) {
  for (let i = 0; i < n; i++) {
    refill(p); if (!p.deck.length) break;
    const c = p.deck.pop(); p.hand.push(c); const d = D(c);
    if (d.type === 'curse') {
      log(`${pname(p)}は呪い「${d.name}」を引いた`, 'trash');
      if (p.heroId === 'garud') { p.rage++; log(`怒り+1（${p.rage}）`, 'dmg'); }
      if (d.draw) await d.draw({ p, o: opp(p), card: c });
    }
  }
  render();
}
function trash(owner, c) {
  G.trash.push(...flatCards([c])); log(`${pname(owner)}の「${D(c).name}」を破棄`, 'trash');
  for (const pl of G.players) if (pl.heroId === 'kuru') { pl.abyss++; fx(pl.idx, '深淵+1', 'info'); }
}
async function trashFromHand(p, max, title = '破棄するカードを選択') {
  if (!p.hand.length) return [];
  const s = await choose({ who: p, title, sub: `${max}枚まで選べます（破棄＝ゲームから除外）`, cards: p.hand, min: 0, max, confirm: '破棄する', emptyConfirm: '破棄しない', ai: 'trash' });
  for (const c of s) { removeFrom(p.hand, c); trash(p, c); }
  render(); return s;
}
async function lookTopTrash(p, n, max, greedy = false) {
  refill(p); const top = p.deck.slice(-n).reverse(); if (!top.length) return [];
  const s = await choose({ who: p, title: `山札の上${top.length}枚`, sub: `破棄するカードを${max >= top.length ? '好きなだけ' : max + '枚まで'}選択（残りは山札の上に戻る）`, cards: top, min: 0, max, confirm: '破棄する', emptyConfirm: '破棄しない', ai: greedy ? 'trashGreedy' : 'trash' });
  for (const c of s) { removeFrom(p.deck, c); trash(p, c); }
  render(); return s;
}
async function mill(t, n) { for (let i = 0; i < n; i++) { refill(t); if (!t.deck.length) break; trash(t, t.deck.pop()); } render(); }
async function forceDiscard(p, o, n) {
  if (!o.hand.length) return;
  const s = await choose({ who: p, title: `${pname(o)}の手札から捨てさせるカードを選択`, cards: o.hand, min: Math.min(n, o.hand.length), max: n, confirm: '捨てさせる', ai: 'oppBest' });
  for (const c of s) { discardFromHand(o, c); log(`${pname(o)}の「${D(c).name}」を捨てさせた`); }
  render();
}
// temp=true は「石化」：相手のターン開始時に自然に解ける威圧
async function sealMore(p, o, n, temp = false) {
  const av = o.hand.filter(c => !G.seals.has(c.uid) && D(c).type !== 'curse'); if (!av.length) return;
  const s = await choose({ who: p, title: `【${temp ? '石化' : '威圧'}】${pname(o)}の手札を${n}枚まで選択`, sub: temp ? '石化されたカードは、相手のターン開始時まで防御・構えに使えない' : '威圧されたカードは、解除されるまで使用・防御・構えに使えない', cards: av, min: 0, max: n, confirm: temp ? '石化する' : '威圧する', emptyConfirm: 'しない', ai: 'seal' });
  s.forEach(c => { G.seals.add(c.uid); if (temp) G.tempSeals.add(c.uid); log(`「${D(c).name}」を${temp ? '石化' : '威圧'}`); }); render();
}
async function steal(p, o) {

// ================= game flow =================
function newPlayer(idx, heroId) {
  const h = HEROES[heroId];
  return { idx, heroId, hero: h, hp: h.hp, maxHp: h.hp, deck: [], hand: [], discard: [], mana: 5, coins: 0, shield: 0, discount: 0,
    abyss: 0, rage: 0, rageNow: 0, storedAtk: 0, blockedAccum: 0, investNext: 0, nextAtkPending: 0, used: {}, attacksThisTurn: 0, skillsThisTurn: 0, turnAtk: 0, heroDeck: [], heroRow: [] };

function startGame(h0, h1, cpus = [null, null]) {
  UID = 1; FUSED = {}; SCREEN = 'game'; M = null; renderModal();

  [h0, h1].forEach((h, i) => {
    const p = newPlayer(i, h);

    p.heroDeck = shuffle(HEROES[h].pool.flatMap(id => [mk(id), mk(id)]));
    p.heroRow = p.heroDeck.splice(-3);

  G.players.forEach((p, i) => { if (cpus[i] === 3) { p.maxHp += 3; p.hp += 3; p.coins += 2; } });
  for (const p of G.players) for (let i = 0; i < 5; i++) p.hand.push(p.deck.pop());

}

}

async function playCard(p, c) {
  const d = D(c), o = opp(p);
  removeFrom(p.hand, c); p.mana -= d.cost;
  if (d.type === 'skill') {
    G.stage = { pi: p.idx, card: c, skill: true, result: 'スキル発動' };

async function resolveAttack(a) {
  const { p, o, card } = a; const d = D(card);

  if (d.play) await d.play(a);
  a.atk += p.turnAtk + p.rageNow + pending;
  if (p.heroId === 'allen' && p.attacksThisTurn >= 1) a.atk += 2;
  if (p.heroId === 'chuta' && p.coins >= 5) a.atk += 1;
  if (p.attacksThisTurn === 0 && p.storedAtk) { a.atk += p.storedAtk; p.storedAtk = 0; }
  p.attacksThisTurn++;
  log(`${pname(p)}の攻撃「${d.name}」ATK${a.atk}${d.unblockable ? '（防御不能）' : ''}`);
  G.stage = { pi: p.idx, card, atk: a.atk, defs: [], def: 0, result: '' };

function cval(c) {
  const d = D(c); if (d.type === 'curse') return -10;

const isBasic = c => ['strike', 'guard', 'pouch'].includes(c.id);
async function aiChoose(o) {
  await sleep(o.ai === 'defend' ? 350 : 250);
  const p = o.who, lv = lvOf(p);
  const av = o.cards.filter(c => !(o.disabled && o.disabled(c)));
  const take = (arr, n) => arr.slice(0, Math.max(0, Math.min(n, arr.length)));
  const byVal = (arr, desc) => [...arr].sort((x, y) => desc ? cval(y) - cval(x) : cval(x) - cval(y));
  switch (o.ai) {
    case 'defend': return aiDefend(p, o.a);
    case 'draft': {
      if (lv === 1) return [rand(av)];
      const size = p.deck.length + p.discard.length + p.hand.length;
      if (size > (lv === 3 ? 20 : 26)) return [];
      return take([...av].sort((x, y) => playScore(p, y) - playScore(p, x)), 1);
    }
    case 'trash': {
      // 基本カードまで削るとドラフトで膨らむデッキの攻撃力が落ちるので、呪い（と大きいデッキの小銭袋）だけ
      const deckSize = p.deck.length + p.discard.length + p.hand.length;
      const bad = av.filter(c => D(c).type === 'curse' || (lv === 3 && deckSize > 16 && c.id === 'pouch'));
      return take(byVal(bad, false), o.max);
    }
    case 'trashGreedy': return take(av.filter(c => lv === 1 ? Math.random() < 0.5 : cval(c) < 3.5), o.max);
    case 'worst': return take(byVal(av, false), Math.max(1, o.min));
    case 'best': return take(byVal(av, true), Math.max(1, o.min));
    case 'oppBest': return lv === 1 ? take(shuffle([...av]), Math.max(o.min, 1)) : take(byVal(av, true), Math.max(o.min, Math.min(o.max, av.length)));
    case 'seal': return lv === 1 ? take(shuffle([...av]), o.max) : take([...av].sort((x, y) => sealScore(y) - sealScore(x)), o.max);
    case 'oppTop': return cval(av[0]) >= 3 ? [av[0]] : [];
    default: return take(av, o.min);
  }
}
async function aiOption(o) {

function sealScore(c) { const d = D(c); return Math.max(d.def, d.type === 'attack' ? d.atk : 0) + (d.stance ? 3 : 0) + (d.price || 1) * 0.3; }
function aiDefend(p, a) {
  const lv = lvOf(p);
  const cand = p.hand.filter(c => D(c).type !== 'curse' && !G.seals.has(c.uid) && dcost(p, c) <= p.mana);
  if (!cand.length) return [];
  const hpEff = p.hp + p.shield;
  const lethal = a.atk >= hpEff;
  if (lv === 1 && !lethal) { if (Math.random() < 0.5) return []; return [rand(cand)]; }
  // 次の自分のターンに残したい度合い（低いほど防御に回しやすい）
  const keep = c => { const d = D(c); let v = d.type === 'attack' ? d.atk * 1.1 - d.cost * 0.2 : (d.price || 1) * 0.6; if (d.stance) v += lv === 3 ? 3 : 1; return v - d.def * 0.8; };
  const sorted = [...cand].sort((x, y) => keep(x) - keep(y));
  const sel = []; let m = p.mana, rem = a.atk;
  const maxCards = Math.min(MAX_DEF, lethal ? 99 : 2);
  // 致死なら防御値の高い順に
  if (lethal) sorted.sort((x, y) => D(y).def - D(x).def);
  for (const c of sorted) {
    if (rem <= 0 || sel.length >= maxCards) break;
    const dc = dcost(p, c); if (dc > m) continue;
    const worth = lethal || rem >= 3 || (lv === 3 && hpEff <= 8) || (lv === 3 && D(a.card).hit && rem > 0 && D(c).def >= rem);
    if (!worth) continue;
    sel.push(c); m -= dc; rem -= D(c).def;
  }
  // つよい：盾ほぼ不要な過剰防御を取り除く

function playScore(p, c) {

    <div class="stage">${st}</div>
    <div class="cbtns"><button onclick="openShop()" ${canAct ? '' : 'disabled'}>🛒 道具屋（🪙${p.coins}）</button>
      <button class="danger" onclick="endTurnClick()" ${canAct ? '' : 'disabled'}>ターン終了 ▶</button></div></div>`;
}
function render() {
  const app = document.getElementById('app');
  if (SCREEN === 'title') { app.innerHTML = titleHTML(); return; }
  if (SCREEN === 'select') { app.innerHTML = selectHTML(); return; }
  if (ANIM === 0 && G.phase !== 'over') return; // 自動テスト時は描画省略
  const top = G.players[1], bot = G.players[0];
  let over = '';
  if (G.phase === 'over') {
    const w = G.players[G.winner];
    over = `<div class="over"><div class="w">${w.hero.art}</div><h1>${isCPU(w) ? 'CPU' : 'P' + (w.idx + 1)} ${w.hero.name} の勝利！</h1><div>ラウンド${G.round}で決着</div>
      <div style="display:flex;gap:12px"><button class="primary" onclick="rematch()">同じ設定で再戦</button><button onclick="toTitle()">タイトルへ</button></div></div>`;
  }
  app.innerHTML = `<div class="game"><div class="board">${panelHTML(top)}${centerHTML()}${panelHTML(bot)}</div>
    <div class="side"><div class="prevslot">カードにマウスを乗せると拡大</div>
      <div class="sidebtns"><button onclick="showRules()">📜 ルール</button><button onclick="viewPile(0,'trash')">⚰ 破棄 ${G.trash.length}</button><button onclick="if(confirm('タイトルに戻りますか？'))toTitle()">🏠</button></div>
      <div class="log">${G.log.map(l => `<div class="${l.cls}">${l.t}</div>`).join('')}</div></div></div>${over}`;
}
function rematch() { startGame(G.picks[0], G.picks[1], G.cpus); }
function toTitle() { SCREEN = 'title'; G = null; M = null; renderModal(); render(); }
function titleHTML() {
  return `<div class="title"><h1>七英札闘</h1><div class="en">SEVEN ARCANA DUEL</div>
    <div class="heroes">${HERO_ORDER.map(k => HEROES[k].art).join('')}</div>
    <div style="color:#bbb;line-height:1.7">1台のPCで遊ぶ2人対戦デッキ構築カードゲーム<br>手札は丸見え。それでも読み合え。</div>
    <div style="display:flex;gap:12px"><button class="primary" style="font-size:18px;padding:12px 30px" onclick="toSelect('pvp')">👥 2人対戦</button>
    <button class="primary" style="font-size:18px;padding:12px 30px" onclick="toSelect('cpu')">🤖 CPU戦</button>
    <button style="font-size:16px" onclick="G=G||{seals:new Set(),log:[]};showRules()">📜 ルール</button></div></div>`;
}
function toSelect(mode) { MODE = mode; SCREEN = 'select'; SEL = []; M = null; renderModal(); render(); }
function selectHTML() {
  const who = SEL.length;
  if (MODE === 'cpu' && who === 2) {
    return `<div class="select"><h2>CPUの強さを選んでください</h2>
      <div style="text-align:center;color:#ccc">あなた：${HEROES[SEL[0]].name}　vs　CPU：${HEROES[SEL[1]].name}</div>
      <div class="diff"><button onclick="startCpu(1)">やさしい<small>気まぐれに動く練習相手</small></button>
      <button class="primary" onclick="startCpu(2)">ふつう<small>素直に攻めて守る</small></button>
      <button class="danger" onclick="startCpu(3)">つよい<small>読み合いを考える＋HP+3・コイン+2</small></button></div>
      <div style="text-align:center;margin-top:20px"><button onclick="SEL.pop();render()">← 戻る</button></div></div>`;
  }
  const label = MODE === 'cpu' ? (who === 0 ? '<span style="color:#4a9cff">あなた</span>のヒーロー' : '<span style="color:#ff7a5a">CPU</span>のヒーロー')
    : (who === 0 ? '<span style="color:#4a9cff">P1</span> のヒーロー' : '<span style="color:#ff7a5a">P2</span> のヒーロー');
  const rnd = MODE === 'cpu' && who === 1 ? `<div style="text-align:center;margin-bottom:10px"><button onclick="pickHero(rand(HERO_ORDER))">🎲 ランダム</button></div>` : '';
  return `<div class="select"><h2>${label}を選んでください</h2>${rnd}
  <div class="hgrid">${HERO_ORDER.map(k => { const h = HEROES[k]; const pk = SEL[0] === k ? `<div class="picked">${MODE === 'cpu' ? 'あなた' : 'P1'}</div>` : '';
    return `<div class="hcard" style="--pc:${h.color}" onclick="pickHero('${k}')">${pk}<div class="top"><div class="portrait">${h.art}</div><div><div class="hname">${h.name}<small>${h.title}</small></div><div class="hp">❤ HP ${h.hp}　<span style="color:#ccc;font-weight:normal">難易度 ${h.diff}</span></div></div></div>${heroDetailHTML(h)}</div>`; }).join('')}</div>
  <div style="text-align:center;margin-top:14px"><button onclick="toTitle()">← タイトルへ</button></div></div>`;
}
function pickHero(k) {
  SEL.push(k);
  if (MODE === 'pvp' && SEL.length === 2) startGame(SEL[0], SEL[1]);
  else render();
}
function startCpu(lv) { startGame(SEL[0], SEL[1], [null, lv]); }

// card preview on hover
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-cid]');
  const pv = document.getElementById('preview');
  if (el && SCREEN === 'game') {
    const id = el.dataset.cid;
    const inst = id[0] === 'F' ? FUSED[+id.slice(1)] : { uid: 0, id };
    if (inst) pv.innerHTML = cardHTML(inst, { cls: 'big' });
  }
});
render();
</script>
</body>
</html>
